<title>DataPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone = one column (files, plot, tools); tablet/desktop = files+tools rail on the left, plot fills the rest. */
:root {
  --bg: #f3f5f6; --panel: #ffffff; --ink: #172026; --muted: #5a6670; --line: #d9dfe3; --soft: #e9eef1;
  --accent: #0a6c80; --accent-ink: #ffffff; --accent-soft: #d8edf1; --danger: #b42318; --mark: #e8590c;
  --font: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1316; --panel: #171c20; --ink: #e5eaed; --muted: #94a1aa; --line: #2a3238; --soft: #20272c;
  --accent: #4db3c9; --accent-ink: #06191e; --accent-soft: #163840; --danger: #f2766b; --mark: #ff8f4d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1316; --panel: #171c20; --ink: #e5eaed; --muted: #94a1aa; --line: #2a3238; --soft: #20272c;
  --accent: #4db3c9; --accent-ink: #06191e; --accent-soft: #163840; --danger: #f2766b; --mark: #ff8f4d; color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
.wrap { padding-inline: 16px; padding-block: 12px 24px; max-width: 1500px; margin: 0 auto; }

header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 4px 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font-weight: 600; font-size: 19px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 430px) { header.top .row { gap: 6px; } header.top .btn { padding-inline: 9px; } }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 8px 12px; min-height: 40px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .seg button:focus-visible, .tree .item:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }

.layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.filescard { order: 1; } .plotcard { order: 2; } .toolscard { order: 3; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: auto 1fr; align-items: start; }
  .filescard { grid-column: 1; grid-row: 1; }
  .toolscard { grid-column: 1; grid-row: 2; }
  .plotcard { grid-column: 2; grid-row: 1 / span 2; }
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card > h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0; padding: 10px 12px 0; display: flex; align-items: center; gap: 8px; }
.card > h2 .count { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
.pad { padding: 10px 12px 12px; }
/* file tree */
.tree { max-height: 34vh; overflow: auto; padding: 4px 6px 6px; overscroll-behavior: contain; }
@media (min-width: 900px) { .tree { max-height: 52vh; } }
.tree .item { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 6px; cursor: pointer; min-height: 38px;
  user-select: none; -webkit-user-select: none; }
.tree .item:hover { background: var(--soft); }
.tree .item.sel { background: var(--accent-soft); }
.tree .tick { width: 18px; height: 18px; border: 1.5px solid var(--line); border-radius: 5px; flex: none; display: grid; place-items: center; }
.tree .item.sel .tick { background: var(--accent); border-color: var(--accent); }
.tree .item.sel .tick::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.tree .caret { width: 26px; height: 26px; border: 0; background: none; border-radius: 5px; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.tree .caret svg { width: 14px; height: 14px; transition: transform .15s; }
.tree .caret.open svg { transform: rotate(90deg); }
.tree .spacer { width: 26px; flex: none; }
.tree .name { min-width: 0; flex: 1; overflow: hidden; overflow-wrap: anywhere; line-height: 1.3;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.tree .folder .name { font-weight: 500; }
.tree .meta { font: 12px var(--mono); color: var(--muted); flex: none; }
.tree .src { width: 14px; height: 14px; color: var(--muted); flex: none; }
.tree .badge { font-size: 11px; color: var(--mark); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; flex: none; }
.empty { color: var(--muted); padding: 14px 8px; font-size: 14px; }
.treebar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 10px; border-top: 1px solid var(--line); }

/* plot */
.plotcard { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.plotbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px 0; }
.field { display: flex; align-items: center; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px;
  min-height: 36px; max-width: 100%; min-width: 0; }
select.col { width: 150px; }
#plot { height: 58vh; min-height: 300px; width: 100%; }
#plot.gesture { touch-action: none; -webkit-user-select: none; user-select: none; }
@media (min-width: 900px) { #plot { height: calc(100vh - 210px); min-height: 420px; } }
.plotfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 12px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--muted); cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.selinfo { font: 13px var(--mono); color: var(--mark); }
.plotbar .live { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.plotempty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 20px; }

.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tools .btn { justify-content: center; }
.tools .btn.wide { grid-column: 1 / -1; }

/* 2D mapping viewer: full-screen layer; plot stays on top while the colour controls scroll */
.mapview { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: auto; overscroll-behavior: contain;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.mapview .mapbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; }
.mapview .mapbar h3 { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; }
.mapview .mapplot { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 0 16px 6px; }
.mapview #mapPlot { height: 52vh; min-height: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; touch-action: none; }
@media (min-width: 900px) { .mapview #mapPlot { height: 62vh; } }
.mapview .mapctl { padding: 4px 16px 24px; display: grid; gap: 12px; max-width: 900px; }
.mapview .ctlcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 10px; min-width: 0; }
.mapview .ctlcard h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mapview .rangerow { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; font-size: 14px; }
.mapview .rangerow input[type=range] { width: 100%; accent-color: var(--accent); }
.mapview .preview { height: 16px; border-radius: 4px; border: 1px solid var(--line); }
.mapview .colorrow { display: grid; grid-template-columns: 2.6em 44px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; font-size: 14px; }
.mapview .colorrow input[type=color] { width: 44px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; }
.mapview .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.mapview .inline input[type=text] { width: 7.5em; }
.sheet textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--panel); font: 13px var(--mono); }
.sheet .grid2 select { width: 100%; }
.sheet details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
.sheet details summary { cursor: pointer; font-size: 14px; font-weight: 500; }
.sheet details[open] summary { margin-bottom: 8px; }
.sheet .chkline { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
.sheet .chkline input { width: 18px; height: 18px; accent-color: var(--accent); }

.status { font-size: 13px; color: var(--muted); padding: 8px 2px 0; display: flex; gap: 8px; align-items: baseline; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.status.err .dot { background: var(--danger); }
.status button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; margin-left: auto; flex: none; }
.log { font: 12px/1.5 var(--mono); color: var(--muted); max-height: 180px; overflow: auto; white-space: pre-wrap; padding: 6px 2px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; max-height: 88vh; overflow: auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.sheet fieldset { border: 0; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; min-width: 0; }
.sheet legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 4px; }
.sheet label.opt { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sheet label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.sheet label.opt input { accent-color: var(--accent); }
.sheet .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sheet .grid2 label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
.sheet .list { font: 13px var(--mono); background: var(--soft); border-radius: 8px; padding: 8px 10px; max-height: 160px; overflow: auto; }
.sheet .list div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .menu { display: grid; gap: 8px; }
.sheet .menu .btn { justify-content: flex-start; min-height: 48px; }
.sheet .menu .btn small { color: var(--muted); margin-left: auto; font-size: 12px; }
.note { font-size: 13px; color: var(--muted); }
.sheet .grow { flex: 1; }
.sheet .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet .inline input[type=text] { flex: 1; min-width: 8em; }
.sheet .inline .note { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); }
.sheet fieldset .dbxlist { max-height: 40vh; }
.dbxpath { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.dbxpath span { font: 13px var(--mono); color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.dbxlist { border: 1px solid var(--line); border-radius: 8px; max-height: 52vh; overflow: auto; overscroll-behavior: contain; }
.dbxlist .ent { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 44px; cursor: pointer; border-bottom: 1px solid var(--line); }
.dbxlist .ent:last-child { border-bottom: 0; }
.dbxlist .ent:hover { background: var(--soft); }
.dbxlist .ent.sel { background: var(--accent-soft); }
.dbxlist .ent svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.dbxlist .ent input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
.dbxlist .ent .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.dbxlist .ent small { font: 11px/1.35 var(--mono); color: var(--muted); text-align: right; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: 0 6px 20px rgb(0 0 0 / .2); }
.busy { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgb(0 0 0 / .25); }
.busy div { background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; border-radius: 10px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>DataPro</b><span>输运数据处理 · 网页版</span></div>
    <div class="row">
      <button class="btn primary" id="btnImport" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>导入</button>
      <button class="btn" id="btnDbx" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 12.5h7.2a2.8 2.8 0 0 0 .4-5.6 4 4 0 0 0-7.7-.9A3.3 3.3 0 0 0 4.5 12.5z"/></svg>Dropbox</button>
      <button class="btn" id="btnPeer" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 12.5a6.4 6.4 0 0 1 0-9M12.5 3.5a6.4 6.4 0 0 1 0 9M5.6 10.4a3.4 3.4 0 0 1 0-4.8M10.4 5.6a3.4 3.4 0 0 1 0 4.8"/><circle cx="8" cy="8" r="1"/></svg>联机</button>
      <button class="btn" id="btnExport" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 13.5h11"/></svg>导出</button>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </header>

  <div class="layout">
      <section class="card filescard">
        <h2>文件 <span class="count" id="treeCount"></span></h2>
        <div class="tree" id="tree" role="tree" aria-label="文件"></div>
        <div class="treebar">
          <button class="btn small" id="btnSelAll" type="button">全选</button>
          <button class="btn small" id="btnSelNone" type="button">取消选择</button>
          <button class="btn small" id="btnFolder" type="button">新建文件夹</button>
          <button class="btn small" id="btnRename" type="button">重命名</button>
          <button class="btn small" id="btnMove" type="button">移动到</button>
          <button class="btn small danger" id="btnDelete" type="button">删除</button>
        </div>
      </section>
      <section class="card toolscard">
        <h2>处理</h2>
        <div class="pad tools">
          <button class="btn" id="btnSym" type="button">对称化</button>
          <button class="btn" id="btnAnti" type="button">反对称化</button>
          <button class="btn" id="btnSplit" type="button">拆分 sweep</button>
          <button class="btn" id="btnMerge" type="button">合并 sweep</button>
          <button class="btn" id="btnReset" type="button">还原数据</button>
          <button class="btn" id="btnCopy" type="button">复制 X/Y</button>
          <button class="btn" id="btnRenameCol" type="button">改列名</button>
          <button class="btn" id="btnMap" type="button">2D mapping</button>
        </div>
      </section>

    <section class="card plotcard">
      <div class="plotbar">
        <label class="field"><span>X</span><select class="col" id="selX"></select></label>
        <label class="field"><span>Y</span><select class="col" id="selY"></select></label>
        <label class="field"><span>X 轴</span><select id="scaleX"><option value="linear">线性</option><option value="log">对数</option></select></label>
        <label class="field"><span>Y 轴</span><select id="scaleY"><option value="linear">线性</option><option value="log">对数</option></select></label>
        <label class="chk" title="X 轴画绝对值（只改显示，不改数据）"><input type="checkbox" id="optAbsX">|X|</label>
        <label class="chk" title="Y 轴画绝对值（只改显示，不改数据）"><input type="checkbox" id="optAbsY">|Y|</label>
        <label class="chk"><input type="checkbox" id="optMarkers" checked>点</label>
        <label class="chk"><input type="checkbox" id="optGrid" checked>网格</label>
        <label class="chk"><input type="checkbox" id="optLegend" checked>图例</label>
        <span class="live" id="liveCtl">
          <button class="btn small" id="btnRefresh" type="button" title="重新读取选中文件的最新版本">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg>刷新</button>
          <label class="chk" title="每 5 秒检查一次，文件变了才重新读取"><input type="checkbox" id="optLive">自动</label>
        </span>
      </div>
      <div id="plot"></div>
      <div class="plotfoot">
        <div class="seg" id="modeSeg" role="group" aria-label="触摸操作">
          <button type="button" data-mode="gesture" aria-pressed="true">手势</button>
          <button type="button" data-mode="zoom" aria-pressed="false">框放大</button>
          <button type="button" data-mode="select" aria-pressed="false">框选</button>
          <button type="button" data-mode="lasso" aria-pressed="false">套索</button>
          <button type="button" data-mode="tap" aria-pressed="false">点选</button>
        </div>
        <button class="btn small" id="btnAuto" type="button">复位视图</button>
        <span class="selinfo" id="selInfo"></span>
        <button class="btn small danger" id="btnDelPts" type="button" hidden>删除选中点</button>
        <button class="btn small" id="btnClearPts" type="button" hidden>清除选择</button>
      </div>
    </section>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">准备就绪</span><button type="button" id="btnLog">记录</button></div>
  <div class="log" id="log" hidden></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TAB10 = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];

const fm = new DP.FileManager();
const state = {
  selected: [],            // selected tree items, in tree order
  open: new Set(),         // expanded folders
  x: '', y: '',
  anchor: null,            // last clicked tree item, for shift-click ranges
  mode: 'gesture',
  zoomed: false,           // view differs from the full-data view
  points: new Map(),       // file -> Set(row index)
  traceFiles: [],
  plotKey: '',
};

// ------------------------------------------------------------------ status
const logLines = [];
function log(msg, err = false) {
  logLines.push(`${new Date().toLocaleTimeString()}  ${msg}`);
  if (logLines.length > 300) logLines.shift();
  $('#statusText').textContent = msg;
  $('#status').classList.toggle('err', err);
  if (!$('#log').hidden) renderLog();
}
function renderLog() { $('#log').textContent = logLines.slice().reverse().join('\n'); }
$('#btnLog').onclick = () => { const l = $('#log'); l.hidden = !l.hidden; $('#btnLog').textContent = l.hidden ? '记录' : '收起'; if (!l.hidden) renderLog(); };

let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
async function withBusy(msg, fn) {
  const b = document.createElement('div');
  b.className = 'busy'; b.innerHTML = `<div>${esc(msg)}</div>`;
  document.body.append(b);
  await new Promise(r => setTimeout(r, 30));
  try { return await fn(); } finally { b.remove(); }
}

// ------------------------------------------------------------------ sheets
function sheet(title, sub, bodyHtml, actions, onMount) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}<form>${bodyHtml}
      <div class="actions"></div></form></div>`;
    const form = scrim.querySelector('form');
    const bar = scrim.querySelector('.actions');
    const close = v => { scrim.remove(); resolve(v); };
    (actions || [{ label: '取消', value: null }, { label: '确定', value: 'ok', primary: true }]).forEach(a => {
      const b = document.createElement('button');
      b.type = a.primary ? 'submit' : 'button';
      b.className = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
      b.textContent = a.label;
      if (!a.primary) b.onclick = () => close(a.value === null ? null : { action: a.value, form });
      bar.append(b);
    });
    const primary = (actions || []).find(a => a.primary) || { value: 'ok' };
    form.onsubmit = e => { e.preventDefault(); close({ action: primary.value, form }); };
    scrim.addEventListener('click', e => { if (e.target === scrim) close(null); });
    scrim.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    document.body.append(scrim);
    const first = scrim.querySelector('input:not([type=radio]), select, .actions .btn.primary');
    if (first) first.focus({ preventScroll: true });
    if (onMount) onMount(scrim, close);
  });
}
const confirmSheet = (title, sub, label = '确定', danger = false) =>
  sheet(title, sub, '', [{ label: '取消', value: null }, { label, value: 'ok', primary: true, danger }]).then(r => !!r);
function radios(name, opts, checked) {
  return opts.map(([v, l]) => `<label class="opt"><input type="radio" name="${name}" value="${esc(v)}"${v === checked ? ' checked' : ''}>${esc(l)}</label>`).join('');
}
const formVal = (form, name) => { const el = form.elements[name]; return el ? el.value : undefined; };

// ------------------------------------------------------------------ helpers
function selectedFiles() {
  const out = [];
  for (const n of state.selected) for (const f of fm.filesRecursive(n)) if (!out.includes(f)) out.push(f);
  return out;
}
function selectedDirectFiles() { return state.selected.filter(n => fm.nodes.has(n) && !fm.nodes.get(n).isFolder); }
const EXAMPLE = '示例数据（可删除）';
function targetFolder() {
  const first = state.selected[0];
  return first && first !== EXAMPLE && fm.nodes.get(first)?.isFolder ? first : null;
}
function orderSelection() {
  const order = fm.walk().map(w => w.name);
  state.selected = state.selected.filter(n => fm.nodes.has(n)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
}
function columnsOf(files) {
  for (const f of files) { const t = fm.current(f); if (t) return t.columns; }
  return [];
}

// ------------------------------------------------------------------ tree
const SRC_ICONS = {
  dropbox: '<svg class="src" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="Dropbox"><title>来自 Dropbox，可以刷新</title><path d="M4.5 12.5h7.2a2.8 2.8 0 0 0 .4-5.6 4 4 0 0 0-7.7-.9A3.3 3.3 0 0 0 4.5 12.5z"/></svg>',
  local: '<svg class="src" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="本地文件"><title>本地文件，可以刷新</title><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg>',
};
SRC_ICONS.peer = '<svg class="src" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="测试电脑"><title>来自测试电脑，可以刷新</title><path d="M3.5 12.5a6.4 6.4 0 0 1 0-9M12.5 3.5a6.4 6.4 0 0 1 0 9M5.6 10.4a3.4 3.4 0 0 1 0-4.8M10.4 5.6a3.4 3.4 0 0 1 0 4.8"/><circle cx="8" cy="8" r="1"/></svg>';
const srcIcon = n => n.src ? SRC_ICONS[n.src.local ? 'local' : n.src.peer ? 'peer' : 'dropbox'] : '';
const CARET = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg>';
function renderTree() {
  orderSelection();
  const el = $('#tree');
  const rows = [];
  const rec = (names, depth) => {
    for (const name of names) {
      const n = fm.nodes.get(name);
      const sel = state.selected.includes(name);
      const pad = 6 + depth * 18;
      if (n.isFolder) {
        const open = state.open.has(name);
        rows.push(`<div class="item folder${sel ? ' sel' : ''}" role="treeitem" aria-expanded="${open}" aria-selected="${sel}" tabindex="0" data-name="${esc(name)}" style="padding-left:${pad}px">
          <button class="caret${open ? ' open' : ''}" type="button" data-caret aria-label="${open ? '收起' : '展开'}">${CARET}</button>
          <span class="tick"></span><span class="name">${esc(name)}</span>${srcIcon(n)}<span class="meta">${fm.filesRecursive(name).length}</span></div>`);
        if (open) rec(n.children, depth + 1);
      } else {
        const t = fm.current(name);
        rows.push(`<div class="item${sel ? ' sel' : ''}" role="treeitem" aria-selected="${sel}" tabindex="0" data-name="${esc(name)}" style="padding-left:${pad}px">
          <span class="spacer"></span><span class="tick"></span><span class="name">${esc(name)}</span>${srcIcon(n)}
          ${n.modified ? '<span class="badge">已改</span>' : ''}<span class="meta">${DP.nrows(t).toLocaleString()}</span></div>`);
      }
    }
  };
  rec(fm.rootItems, 0);
  const files = [...fm.nodes.values()].filter(n => !n.isFolder).length;
  $('#treeCount').textContent = files ? `${files} 个文件` + (state.selected.length ? ` · 已选 ${state.selected.length}` : '') : '';
  el.innerHTML = rows.join('') || '<div class="empty">还没有数据。点上方“导入”从“文件”App 里选 txt、csv、hk 或 h5 文件；想随时刷新正在测的数据，就用“Dropbox”导入。</div>';
}
$('#tree').addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (!item) return;
  const name = item.dataset.name;
  if (e.target.closest('[data-caret]')) {
    state.open.has(name) ? state.open.delete(name) : state.open.add(name);
    renderTree();
    return;
  }
  // shift-click: add everything shown between the last clicked item and this one
  const rows = [...$('#tree').querySelectorAll('.item')];
  const a = rows.findIndex(r => r.dataset.name === state.anchor), b = rows.indexOf(item);
  if (e.shiftKey && a >= 0 && a !== b) {
    // between two files, stay at file level instead of pulling in whole folders
    const filesOnly = ![rows[a], item].some(r => r.classList.contains('folder'));
    for (const r of rows.slice(Math.min(a, b), Math.max(a, b) + 1))
      if (!(filesOnly && r.classList.contains('folder')) && !state.selected.includes(r.dataset.name)) state.selected.push(r.dataset.name);
  } else {
    const i = state.selected.indexOf(name);
    if (i >= 0) state.selected.splice(i, 1); else state.selected.push(name);
  }
  state.anchor = name;
  onSelectionChange();
});
$('#tree').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); e.target.click(); }
});
$('#btnSelAll').onclick = () => { state.selected = fm.rootItems.slice(); onSelectionChange(); };
$('#btnSelNone').onclick = () => { state.selected = []; onSelectionChange(); };

function onSelectionChange() {
  renderTree();
  updateColumns();
  plot();
}

// ------------------------------------------------------------------ columns
function fillSelect(sel, cols, value) {
  sel.innerHTML = cols.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (cols.includes(value)) sel.value = value;
}
function updateColumns() {
  const cols = columnsOf(selectedFiles());
  if (!cols.length) { fillSelect($('#selX'), [], ''); fillSelect($('#selY'), [], ''); return; }
  if (!cols.includes(state.x)) state.x = cols[0];
  if (!cols.includes(state.y)) state.y = cols[1] || cols[0];
  fillSelect($('#selX'), cols, state.x);
  fillSelect($('#selY'), cols, state.y);
}
$('#selX').onchange = e => { state.x = e.target.value; clearPoints(false); plot(); save(); };
$('#selY').onchange = e => { state.y = e.target.value; clearPoints(false); plot(); save(); };
['scaleX', 'scaleY', 'optAbsX', 'optAbsY', 'optMarkers', 'optGrid', 'optLegend'].forEach(id => { $('#' + id).onchange = () => { plot(); save(); }; });

// ------------------------------------------------------------------ plot
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function axisTitle(t) { return { text: t, font: { size: 13 } }; }

function plot() {
  const el = $('#plot');
  const files = selectedFiles();
  const x = state.x, y = state.y;
  if (!files.length || !x || !y) {
    Plotly.purge(el);
    el.innerHTML = `<div class="plotempty">${fm.nodes.size ? '在左侧点选文件或文件夹，就会画出 X–Y 曲线。' : '导入数据后在这里画图。'}</div>`;
    state.traceFiles = [];
    updatePointUi();
    return;
  }
  if (el.querySelector('.plotempty')) el.innerHTML = '';
  const markers = $('#optMarkers').checked;
  // |X| / |Y| only change what is drawn; point indices stay those of the data
  const absX = $('#optAbsX').checked, absY = $('#optAbsY').checked;
  const col = (t, c, abs) => abs ? t.data[c].map(Math.abs) : t.data[c];
  const traces = [];
  state.traceFiles = [];
  files.forEach((f, i) => {
    const t = fm.current(f);
    if (!t || !t.columns.includes(x) || !t.columns.includes(y)) return;
    const n = DP.nrows(t);
    traces.push({
      type: n > 4000 ? 'scattergl' : 'scatter', mode: markers ? 'lines+markers' : 'lines', name: f,
      x: col(t, x, absX), y: col(t, y, absY), line: { width: 1.5, color: TAB10[i % 10] },
      marker: { size: 5, color: TAB10[i % 10] }, opacity: 0.85,
      hovertemplate: `${esc(f)}<br>${esc(x)}=%{x}<br>${esc(y)}=%{y}<extra></extra>`,
    });
    state.traceFiles.push(f);
  });
  // highlighted points
  const px = [], py = [];
  for (const [f, set] of state.points) {
    const t = fm.current(f);
    if (!t || !t.columns.includes(x) || !t.columns.includes(y)) continue;
    for (const i of set) { px.push(absX ? Math.abs(t.data[x][i]) : t.data[x][i]); py.push(absY ? Math.abs(t.data[y][i]) : t.data[y][i]); }
  }
  if (px.length) traces.push({ type: 'scatter', mode: 'markers', x: px, y: py, name: '选中点', showlegend: false, hoverinfo: 'skip',
    marker: { size: 11, color: 'rgba(0,0,0,0)', line: { width: 2, color: cssVar('--mark') } } });

  const ink = cssVar('--ink'), line = cssVar('--line'), muted = cssVar('--muted');
  const grid = $('#optGrid').checked;
  const ax = (title, type) => ({ title: axisTitle(title), type, showgrid: grid, gridcolor: line, griddash: 'dash', zeroline: false,
    linecolor: muted, mirror: true, ticks: 'outside', tickcolor: muted, color: ink, exponentformat: 'e', automargin: true });
  const key = `${files.join('|')}::${x}::${y}::${$('#scaleX').value}${$('#scaleY').value}${absX}${absY}`;
  const narrow = el.clientWidth < 600;
  const layout = {
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { family: cssVar('--font'), color: ink, size: 12 },
    margin: { l: 56, r: 14, t: 10, b: 46 }, xaxis: ax(absX ? `|${x}|` : x, $('#scaleX').value), yaxis: ax(absY ? `|${y}|` : y, $('#scaleY').value),
    showlegend: $('#optLegend').checked && state.traceFiles.length <= 10,
    legend: narrow ? { orientation: 'h', x: 0, y: -0.22, yanchor: 'top', font: { size: 11 } } : { x: 1, xanchor: 'right', y: 1, bgcolor: cssVar('--panel'), bordercolor: line, borderwidth: 1, font: { size: 11 } },
    dragmode: dragModeOf(state.mode), hovermode: 'closest', uirevision: key, selections: [],
    hoverlabel: { font: { family: cssVar('--mono') } },
  };
  if (key !== state.plotKey) { state.plotKey = key; state.zoomed = false; }
  Plotly.react(el, traces, layout, { responsive: true, displayModeBar: false, scrollZoom: true, doubleClick: 'reset' });
  el.classList.toggle('gesture', state.mode === 'gesture');
  if (!el._bound) {
    bindPlotEvents(el);
    bindTouchGestures(el, { active: () => state.mode === 'gesture', reset: resetView,
      get zoomed() { return state.zoomed; }, set zoomed(v) { state.zoomed = v; } });
  }
  updatePointUi();
}

function bindPlotEvents(el) {
  el._bound = true;
  el.on('plotly_selected', ev => {
    if (!ev || !ev.points || !ev.points.length) return;
    let added = 0;
    for (const p of ev.points) {
      const f = state.traceFiles[p.curveNumber];
      if (!f) continue;
      const idx = p.pointIndex ?? p.pointNumber;
      if (!state.points.has(f)) state.points.set(f, new Set());
      const s = state.points.get(f);
      if (!s.has(idx)) { s.add(idx); added++; }
    }
    log(`选中 ${added} 个点`);
    plot();
  });
  el.on('plotly_click', ev => {
    if (state.mode !== 'tap' || !ev || !ev.points || !ev.points.length) return;
    const p = ev.points[0];
    const f = state.traceFiles[p.curveNumber];
    if (!f) return;
    const idx = p.pointIndex ?? p.pointNumber;
    if (!state.points.has(f)) state.points.set(f, new Set());
    const s = state.points.get(f);
    s.has(idx) ? s.delete(idx) : s.add(idx);
    plot();
  });
}

function dragModeOf(mode) {
  // in gesture mode touches are handled below; a mouse still pans through Plotly
  return mode === 'gesture' ? 'pan' : mode === 'tap' ? false : mode;
}

// ------------------------------------------------------------------ touch gestures (photo-style)
// one finger pans (with inertia), two fingers pinch around their midpoint, double tap zooms in / back out,
// single tap shows the nearest value. Ranges are worked in axis coordinates, so log axes behave too.
function bindTouchGestures(el, ctx) {
  const axes = () => { const L = el._fullLayout; return L && L.xaxis && L.yaxis ? [L.xaxis, L.yaxis] : null; };
  // pixel (relative to el) -> axis coordinate, from a snapshot of the axis
  const snap = ax => ({ r0: ax.range[0], r1: ax.range[1], off: ax._offset, len: ax._length });
  const fracX = (s, px) => (px - s.off) / s.len;
  const fracY = (s, py) => (s.off + s.len - py) / s.len;
  const coord = (s, f) => s.r0 + f * (s.r1 - s.r0);

  let pending = null, frame = 0, timer = 0;
  function flush() {
    cancelAnimationFrame(frame); clearTimeout(timer); frame = timer = 0;
    const p = pending; pending = null;
    if (p) Plotly.relayout(el, p);
  }
  function apply(xr, yr) {
    pending = { 'xaxis.range': xr, 'yaxis.range': yr };
    ctx.zoomed = true;
    // one redraw per frame; the timer covers views where animation frames are paused
    if (!frame) { frame = requestAnimationFrame(flush); timer = setTimeout(flush, 40); }
  }
  const local = t => { const r = el.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const inPlot = p => { const a = axes(); return a && p.x >= a[0]._offset && p.x <= a[0]._offset + a[0]._length && p.y >= a[1]._offset && p.y <= a[1]._offset + a[1]._length; };

  let g = null;            // active gesture
  let inertia = 0;
  let lastTap = null, tapTimer = 0;

  function startPan(p) {
    const [xa, ya] = axes();
    g = { kind: 'pan', p0: p, sx: snap(xa), sy: snap(ya), moved: false, t0: performance.now(), hist: [{ p, t: performance.now() }] };
  }
  function startPinch(a, b) {
    const [xa, ya] = axes();
    const dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    // fingers side by side stretch X only, one above the other stretch Y only, diagonal scales both
    const lock = angle < 25 ? 'x' : angle > 65 ? 'y' : 'xy';
    g = { kind: 'pinch', lock, sx: snap(xa), sy: snap(ya), m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, d0: { x: Math.max(dx, 1), y: Math.max(dy, 1), r: Math.max(Math.hypot(dx, dy), 1) }, moved: true };
  }

  el.addEventListener('touchstart', e => {
    if (!ctx.active() || !axes()) return;
    cancelAnimationFrame(inertia); inertia = 0;
    e.preventDefault(); e.stopPropagation();
    const ts = [...e.touches].map(local);
    if (ts.length >= 2) startPinch(ts[0], ts[1]);
    else if (inPlot(ts[0])) startPan(ts[0]);
    else g = null;
  }, { capture: true, passive: false });

  el.addEventListener('touchmove', e => {
    if (!ctx.active() || !g) return;
    e.preventDefault(); e.stopPropagation();
    const ts = [...e.touches].map(local);
    if (g.kind === 'pan' && ts.length === 1) {
      const p = ts[0], { sx, sy } = g;
      if (Math.hypot(p.x - g.p0.x, p.y - g.p0.y) > 6) g.moved = true;
      if (!g.moved) return;
      const ddx = (p.x - g.p0.x) / sx.len * (sx.r1 - sx.r0), ddy = (p.y - g.p0.y) / sy.len * (sy.r1 - sy.r0);
      apply([sx.r0 - ddx, sx.r1 - ddx], [sy.r0 + ddy, sy.r1 + ddy]);
      g.hist.push({ p, t: performance.now() });
      if (g.hist.length > 6) g.hist.shift();
    } else if (g.kind === 'pinch' && ts.length >= 2) {
      const [a, b] = ts, { sx, sy, m0, d0, lock } = g;
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const r = Math.max(Math.hypot(b.x - a.x, b.y - a.y), 1);
      const kx = lock === 'y' ? 1 : d0.r / r, ky = lock === 'x' ? 1 : d0.r / r;
      // the data point under the starting midpoint stays under the fingers
      const cx = coord(sx, fracX(sx, m0.x)), cy = coord(sy, fracY(sy, m0.y));
      const wx = (sx.r1 - sx.r0) * kx, wy = (sy.r1 - sy.r0) * ky;
      const x0 = cx - fracX(sx, m.x) * wx, y0 = cy - fracY(sy, m.y) * wy;
      apply([x0, x0 + wx], [y0, y0 + wy]);
    } else if (ts.length >= 2) startPinch(ts[0], ts[1]);
  }, { capture: true, passive: false });

  el.addEventListener('touchend', e => {
    if (!ctx.active() || !g) return;
    e.preventDefault(); e.stopPropagation();
    if (e.touches.length === 1) { startPan(local(e.touches[0])); g.moved = true; return; }  // pinch -> pan
    if (e.touches.length) return;
    const done = g; g = null;
    if (done.kind !== 'pan') return;
    if (!done.moved) { onTap(done.p0); return; }
    // release velocity from the last ~80 ms, then glide
    const now = performance.now(), recent = done.hist.filter(h => now - h.t < 80);
    if (recent.length < 2) return;
    const a = recent[0], b = recent[recent.length - 1], dt = Math.max(b.t - a.t, 1);
    let vx = (b.p.x - a.p.x) / dt, vy = (b.p.y - a.p.y) / dt;   // px per ms
    if (Math.hypot(vx, vy) < 0.25) return;
    const [xa, ya] = axes();
    let sx = snap(xa), sy = snap(ya), last = now;
    const step = t => {
      const dtt = t - last; last = t;
      const decay = Math.pow(0.94, dtt / 16);
      vx *= decay; vy *= decay;
      const ddx = vx * dtt / sx.len * (sx.r1 - sx.r0), ddy = vy * dtt / sy.len * (sy.r1 - sy.r0);
      sx = { ...sx, r0: sx.r0 - ddx, r1: sx.r1 - ddx }; sy = { ...sy, r0: sy.r0 + ddy, r1: sy.r1 + ddy };
      apply([sx.r0, sx.r1], [sy.r0, sy.r1]);
      inertia = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(step) : 0;
    };
    inertia = requestAnimationFrame(step);
  }, { capture: true, passive: false });

  el.addEventListener('touchcancel', () => { g = null; }, { capture: true });

  function onTap(p) {
    const now = performance.now();
    if (lastTap && now - lastTap.t < 320 && Math.hypot(p.x - lastTap.p.x, p.y - lastTap.p.y) < 30) {
      clearTimeout(tapTimer); lastTap = null;
      if (ctx.zoomed) { ctx.reset(); return; }
      const [xa, ya] = axes(), sx = snap(xa), sy = snap(ya), k = 1 / 2.5;
      const cx = coord(sx, fracX(sx, p.x)), cy = coord(sy, fracY(sy, p.y));
      const wx = (sx.r1 - sx.r0) * k, wy = (sy.r1 - sy.r0) * k;
      // zoom into the tapped point, keeping it where the finger is
      const x0 = cx - fracX(sx, p.x) * wx, y0 = cy - fracY(sy, p.y) * wy;
      Plotly.relayout(el, { 'xaxis.range': [x0, x0 + wx], 'yaxis.range': [y0, y0 + wy] });
      ctx.zoomed = true;
      return;
    }
    lastTap = { p, t: now };
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      // single tap: read out the nearest point
      const [xa, ya] = axes();
      Plotly.Fx.hover(el, { xpx: p.x - xa._offset, ypx: p.y - ya._offset });
    }, 330);
  }

  el.on('plotly_relayout', ev => {
    if (ev && (ev['xaxis.autorange'] || ev['yaxis.autorange'])) ctx.zoomed = false;
    else if (ev && (ev['xaxis.range[0]'] !== undefined || ev['xaxis.range'])) ctx.zoomed = true;
  });
}

function countPoints() { let n = 0; for (const s of state.points.values()) n += s.size; return n; }
function updatePointUi() {
  const n = countPoints();
  $('#selInfo').textContent = n ? `已选 ${n} 个点` : '';
  $('#btnDelPts').hidden = !n;
  $('#btnClearPts').hidden = !n;
}
function clearPoints(redraw = true) { state.points.clear(); if (redraw) plot(); else updatePointUi(); }

$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');

// top-level nodes created since `before` was taken
function topAdded(before) {
  const added = [...fm.nodes.keys()].filter(n => !before.has(n));
  return added.filter(n => !added.includes(fm.nodes.get(n).parent));
}
function finishImport(target, before) {
  if (target) state.open.add(target);
  // select what was just imported so it plots right away
  const top = topAdded(before);
  if (top.length) state.selected = top;
  onSelectionChange(); save();
}

// parse first, add later: a refresh only drops the old nodes once the new file has parsed
async function parseFile(file) {
  const lower = file.name.toLowerCase();
  const base = file.name.replace(/\.[^.]+$/, '');
  if (lower.endsWith('.h5') || lower.endsWith('.hdf5')) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const r = await readH5(buf, base);
    return { add: target => addItems(r.items, target, r.structured),
      msg: `已读取 HDF5：${file.name}（${r.items.filter(i => !i.isFolder).length} 个数据）` };
  } else if (lower.endsWith('.hk')) {
    const r = DP.parseHkFile(await file.text());
    return {
      add: target => {
        const folder = fm.addFolder(base, target).name;
        r.runs.forEach(run => fm.addFile(run.name, run.table, folder));
        state.open.add(folder);
      },
      msg: `已读取 HK：${base}（${r.runs.length} 个 run，${r.blocks} 个数据块${r.skipped ? `，跳过 ${r.skipped} 个` : ''}）` };
  } else if (lower.endsWith('.json')) {
    const items = DP.projectFromJson(await file.text());
    return { add: target => addItems(items, target, true), msg: `已打开工程：${file.name}` };
  }
  const t = DP.parseTextFile(await file.text());
  return { add: target => fm.addFile(file.name, t, target), msg: `已读取：${file.name}（${DP.nrows(t)} 行，${t.columns.length} 列）` };
}
async function importFile(file, target) {
  const p = await parseFile(file);
  p.add(target);
  log(p.msg);
}

// mirrors load_hdf5_file: folders keep their parents, top level goes into the target folder
function addItems(items, target, structured) {
  const rename = new Map();
  for (const it of items) {
    const parent = it.parent ? (rename.get(it.parent) || it.parent) : target;
    const node = it.isFolder ? fm.addFolder(it.name, parent) : fm.addFile(it.name, it.table, parent);
    if (node.name !== it.name) rename.set(it.name, node.name);
    if (it.isFolder && (!it.parent || !structured)) state.open.add(node.name);
  }
}

// ------------------------------------------------------------------ Dropbox (read-only; tokens stay in this browser)
// Files imported from here remember their Dropbox path (node.src on the top-level nodes), so "刷新" can
// re-download them in place. Sign-in is OAuth code flow with PKCE, so no secret lives in the page.
const DBX_KEY = 'ld8d685cjjessf2';
const DBX_LS = 'datapro-dbx';
const DBX_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
const inFrame = (() => { try { return window.top !== window; } catch (e) { return true; } })();
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } };
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function dbxLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  lsSet(DBX_LS + '-pending', { verifier, state: st });
  await saveNow();   // the page is about to navigate away
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({ client_id: DBX_KEY, response_type: 'code',
    code_challenge: challenge, code_challenge_method: 'S256', token_access_type: 'offline', redirect_uri: DBX_REDIRECT, state: st });
}
async function dbxToken(body) {
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', cache: 'no-store', body: new URLSearchParams({ client_id: DBX_KEY, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || `HTTP ${r.status}`), { login: r.status === 400 || r.status === 401 });
  return j;
}
// true when this page load is the way back from a successful Dropbox sign-in
async function dbxFinishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return false;
  history.replaceState(null, '', DBX_REDIRECT + location.hash);
  const p = lsGet(DBX_LS + '-pending');
  lsSet(DBX_LS + '-pending', null);
  if (q.has('error')) { log('Dropbox 登录已取消', true); return false; }
  if (!p || p.state !== q.get('state')) { log('Dropbox 登录失败：请再试一次', true); return false; }
  try {
    const j = await dbxToken({ grant_type: 'authorization_code', code: q.get('code'), code_verifier: p.verifier, redirect_uri: DBX_REDIRECT });
    lsSet(DBX_LS, { refresh: j.refresh_token, access: j.access_token, exp: Date.now() + j.expires_in * 1000 });
    log('已登录 Dropbox');
    return true;
  } catch (e) { log(`Dropbox 登录失败：${e.message}（回调地址 ${DBX_REDIRECT}）`, true); return false; }
}
async function dbxAccess(force) {
  const a = lsGet(DBX_LS);
  if (!a || !a.refresh) throw Object.assign(new Error('还没登录 Dropbox'), { login: true });
  if (!force && a.access && a.exp - Date.now() > 60e3) return a.access;
  let j;
  try { j = await dbxToken({ grant_type: 'refresh_token', refresh_token: a.refresh }); }
  catch (e) { if (e.login) lsSet(DBX_LS, null); throw e; }
  lsSet(DBX_LS, { ...a, access: j.access_token, exp: Date.now() + j.expires_in * 1000 });
  return j.access_token;
}
// HTTP headers are ASCII: escape the rest inside Dropbox-API-Arg
const headerJson = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
// download: returns a Blob; upload (a string or Blob): sends it as the file body
async function dbxCall(endpoint, arg, download = false, upload) {
  const content = download || upload !== undefined;
  for (let retry = false; ; retry = true) {
    const headers = { Authorization: 'Bearer ' + await dbxAccess(retry) };
    const opts = { method: 'POST', headers, cache: 'no-store' };
    if (content) headers['Dropbox-API-Arg'] = headerJson(arg);
    if (upload !== undefined) { headers['Content-Type'] = 'application/octet-stream'; opts.body = upload; }
    else if (!content) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(arg); }
    const r = await fetch(`https://${content ? 'content' : 'api'}.dropboxapi.com/2/${endpoint}`, opts);
    if (r.status === 401 && !retry) continue;
    if (r.ok) return download ? r.blob() : r.json();
    let msg = await r.text().catch(() => '');
    try { msg = JSON.parse(msg).error_summary || msg; } catch (e) { /* plain text error */ }
    // a token from before a permission was added lacks it until the next sign-in
    const scope = /required scope|missing_scope/.test(msg);
    throw Object.assign(new Error(msg || `HTTP ${r.status}`), { notFound: /not_found/.test(msg), login: r.status === 401 || scope, scope });
  }
}
async function dbxList(path) {
  let r = await dbxCall('files/list_folder', { path, limit: 2000 });
  const out = r.entries.slice();
  while (r.has_more) { r = await dbxCall('files/list_folder/continue', { cursor: r.cursor }); out.push(...r.entries); }
  return out;
}
// metadata first, so an unchanged file costs one small request
async function dbxFetch(path, knownRev) {
  const meta = await dbxCall('files/get_metadata', { path });
  if (meta['.tag'] !== 'file') throw new Error('不是文件');
  if (meta.rev === knownRev) return { meta };
  const blob = await dbxCall('files/download', { path: 'rev:' + meta.rev }, true);
  return { meta, file: new File([blob], meta.name) };
}
async function dbxProblem(e) {
  if (!e.login) { log(`Dropbox：${e.message}`, true); toast('Dropbox 读取失败'); return; }
  if (e.scope) {
    if (await confirmSheet('Dropbox 权限不够', '联机要用到 files.content.write：在 Dropbox 开发者后台的 Permissions 里勾上它并点 Submit，再回来重新登录。', '重新登录')) dbxLogin();
    return;
  }
  if (await confirmSheet('需要登录 Dropbox', '第一次使用，或者登录已经过期。只申请读取权限，登录信息只存在这台设备的浏览器里。', '去登录')) dbxLogin();
}

const FOLDER_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 4.5v8h13v-7H8L6.5 4h-5z"/></svg>';
const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;
const fmtClock = s => new Date(s).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtTime = s => new Date(s).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
// opts.folder: pick a folder instead of files; resolves with its path
function dbxBrowse(opts = {}) {
  return new Promise(resolve => {
    const picked = new Map();
    let dir = opts.folder ? opts.start || '' : lsGet(DBX_LS + '-dir') || '', entries = [];
    const title = opts.folder ? '选联机文件夹' : '从 Dropbox 导入';
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
      <h3>${title}</h3><p class="sub">${opts.folder ? '进到共享给组里人的那个文件夹，再点“用这个文件夹”。' : '导入后选中文件点“刷新”，就会读 Dropbox 里的最新版本。'}</p>
      <div class="dbxpath"><button class="btn small" type="button" data-up>上一级</button><span data-path></span></div>
      <div class="dbxlist" data-list></div>
      <div class="actions"><button class="btn small" type="button" data-logout>退出登录</button><span class="grow"></span>
        <button class="btn" type="button" data-cancel>取消</button><button class="btn primary" type="button" data-ok disabled>导入</button></div></div>`;
    const q = s => scrim.querySelector(s);
    const list = q('[data-list]');
    const close = v => { scrim.remove(); resolve(v); };
    const updateOk = () => {
      const ok = q('[data-ok]');
      if (opts.folder) { ok.disabled = !dir; ok.textContent = '用这个文件夹'; return; }
      ok.disabled = !picked.size; ok.textContent = picked.size ? `导入 ${picked.size} 个` : '导入';
    };
    async function load(path) {
      dir = path;
      if (!opts.folder) lsSet(DBX_LS + '-dir', dir);
      updateOk();
      q('[data-path]').textContent = dir || 'Dropbox';
      q('[data-up]').disabled = !dir;
      list.innerHTML = '<div class="empty">正在读取…</div>';
      let got;
      try { got = await dbxList(dir); }
      catch (e) {
        if (path !== dir) return;
        if (e.notFound && dir) { load(''); return; }   // the remembered folder is gone
        if (e.login) { close(null); dbxProblem(e); return; }
        list.innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`;
        return;
      }
      if (path !== dir) return;   // navigated elsewhere meanwhile
      entries = got;
      render();
    }
    function render() {
      const folders = entries.filter(e => e['.tag'] === 'folder').sort((a, b) => a.name.localeCompare(b.name));
      // newest first: the file being measured is usually on top
      const files = opts.folder ? [] : entries.filter(e => e['.tag'] === 'file').sort((a, b) => b.server_modified.localeCompare(a.server_modified));
      list.innerHTML = [
        ...folders.map(f => `<div class="ent" role="button" tabindex="0" data-dir="${esc(f.path_display)}">${FOLDER_ICON}<span class="nm">${esc(f.name)}</span>${CARET}</div>`),
        ...files.map(f => `<label class="ent${picked.has(f.path_lower) ? ' sel' : ''}"><input type="checkbox" data-file="${esc(f.path_lower)}"${picked.has(f.path_lower) ? ' checked' : ''}>
          <span class="nm">${esc(f.name)}</span><small>${fmtSize(f.size)}<br>${fmtTime(f.server_modified)}</small></label>`),
      ].join('') || '<div class="empty">这个文件夹是空的</div>';
    }
    list.addEventListener('click', e => { const d = e.target.closest('[data-dir]'); if (d) load(d.dataset.dir); });
    list.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.dir) { e.preventDefault(); load(e.target.dataset.dir); } });
    list.addEventListener('change', e => {
      const p = e.target.dataset.file;
      if (!p) return;
      if (e.target.checked) picked.set(p, entries.find(x => x.path_lower === p)); else picked.delete(p);
      e.target.closest('.ent').classList.toggle('sel', e.target.checked);
      updateOk();
    });
    q('[data-up]').onclick = () => load(dir.slice(0, dir.lastIndexOf('/')));
    q('[data-cancel]').onclick = () => close(null);
    q('[data-ok]').onclick = () => close(opts.folder ? dir : [...picked.values()]);
    q('[data-logout]').onclick = () => { lsSet(DBX_LS, null); log('已退出 Dropbox'); close(null); };
    scrim.addEventListener('click', e => { if (e.target === scrim) close(null); });
    scrim.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    document.body.append(scrim);
    load(dir);
  });
}

async function dbxImport() {
  if (inFrame) { toast('Dropbox 只能在独立网页版里用'); return; }
  if (!lsGet(DBX_LS)?.refresh) { dbxProblem({ login: true }); return; }
  const picked = await dbxBrowse();
  if (!picked || !picked.length) return;
  const target = targetFolder();
  const before = new Set(fm.nodes.keys());
  let problem = null;
  await withBusy(`正在从 Dropbox 读取 ${picked.length} 个文件…`, async () => {
    for (const ent of picked) {
      try {
        const { meta, file } = await dbxFetch(ent.path_lower);
        const p = await parseFile(file);
        const b = new Set(fm.nodes.keys());
        p.add(target);
        const src = { path: meta.path_lower, rev: meta.rev };
        topAdded(b).forEach(n => { fm.nodes.get(n).src = src; });
        log(p.msg);
      } catch (err) {
        if (err.login) { problem = err; break; }
        log(`${ent.name}：${err.message || err}`, true); toast(`${ent.name} 读取失败`);
      }
    }
  });
  finishImport(target, before);
  if (problem) dbxProblem(problem);
}

// ------------------------------------------------------------------ local files (Chrome/Edge on a computer)
// showOpenFilePicker hands back a handle the page may read again later, so these files refresh straight
// from disk, without waiting for Dropbox to sync. node.src = { path: 'local:<id>', local: true, rev: 'mtime:size' }.
const canPickFiles = 'showOpenFilePicker' in window && !inFrame;
const handles = new Map();   // src.path -> FileSystemFileHandle (kept in IndexedDB between visits)
const stampOf = f => `${f.lastModified}:${f.size}`;
// read the whole file now; Chrome refuses to read a File object once the file on disk has changed
async function readHandle(h) {
  for (let tries = 0; ; tries++) {
    const f = await h.getFile();
    try { return new File([await f.arrayBuffer()], f.name, { lastModified: f.lastModified }); }
    catch (e) { if (tries >= 2 || e.name !== 'NotReadableError') throw e; }   // written to mid-read: try again
  }
}
async function importLocal() {
  let picked;
  try { picked = await showOpenFilePicker({ multiple: true, id: 'datapro' }); }
  catch (e) { if (e.name !== 'AbortError') toast('无法打开文件：' + e.message); return; }
  const target = targetFolder();
  const before = new Set(fm.nodes.keys());
  await withBusy(`正在读取 ${picked.length} 个文件…`, async () => {
    for (const h of picked) {
      try {
        const file = await readHandle(h);
        const p = await parseFile(file);
        const b = new Set(fm.nodes.keys());
        p.add(target);
        const id = 'local:' + b64url(crypto.getRandomValues(new Uint8Array(9)));
        handles.set(id, h);
        const src = { path: id, local: true, rev: stampOf(file) };
        topAdded(b).forEach(n => { fm.nodes.get(n).src = src; });
        log(p.msg);
      } catch (err) { log(`${h.name}：${err.message || err}`, true); toast(`${h.name} 读取失败`); }
    }
  });
  finishImport(target, before);
}
async function localFetch(src, ask) {
  const h = handles.get(src.path);
  if (!h) throw new Error('这台设备上没有这个文件的记录，请重新导入');
  // after a reload Chrome may want the permission again, and only grants it on a click
  if (await h.queryPermission({ mode: 'read' }) !== 'granted'
      && (!ask || await h.requestPermission({ mode: 'read' }) !== 'granted'))
    throw Object.assign(new Error('需要允许读取这个文件'), { permission: true });
  const f = await h.getFile();
  const time = new Date(f.lastModified).toISOString();
  if (stampOf(f) === src.rev) return { name: f.name, time };
  const file = await readHandle(h);
  return { file, name: f.name, time, src: { ...src, rev: stampOf(file) } };
}

// ------------------------------------------------------------------ 联机: data straight from a measurement PC
// One computer is marked 测试电脑. It leaves a small host-<id>.json in the 联机 folder, and a device that wants its data
// drops a WebRTC offer next to it and picks up the answer. Dropbox only carries this handshake (a few KB, deleted
// once read); the data itself goes device to device. Files from it: src = { path: 'peer:<host>:<id>', peer, fid, rev }.
// a folder shared with the people who may connect; each device picks it once, since a shared
// folder can sit at a different path in each member's Dropbox
const peerDir = () => lsGet('datapro-peer-dir') || '/DataPro 联机';
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
const CHUNK = 64 * 1024;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const deviceId = (() => {
  let v = lsGet('datapro-device');
  if (!v) { v = b64url(crypto.getRandomValues(new Uint8Array(9))); lsSet('datapro-device', v); }
  return v;
})();
const putJson = (path, o) => dbxCall('files/upload', { path, mode: 'overwrite', mute: true }, false, JSON.stringify(o));
const getJson = async path => JSON.parse(await (await dbxCall('files/download', { path }, true)).text());
const dropFile = path => dbxCall('files/delete_v2', { path }).catch(() => {});
// non-trickle ICE: wait until the candidates are in the description, so one file round trip is enough
function iceDone(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 5000);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}

// --- host side (测试电脑)
const host = { on: false, name: '', peers: new Map(), beat: null, run: 0 };
const hostDir = () => `${peerDir()}/${deviceId}`;
function sharedFiles() {
  return [...sources()].filter(([p]) => p.startsWith('local:') && handles.has(p))
    .map(([p, names]) => ({ id: p, name: handles.get(p).name || names[0] }));
}
async function hostStart(name) {
  // reading the shared files later happens without a click, so ask for permission now
  for (const f of sharedFiles()) {
    const h = handles.get(f.id);
    try { if (await h.queryPermission({ mode: 'read' }) !== 'granted') await h.requestPermission({ mode: 'read' }); } catch (e) { /* stays unreadable */ }
  }
  host.on = true; host.name = name; host.run++;
  lsSet('datapro-host', { name, on: true });
  const announce = () => putJson(`${peerDir()}/host-${deviceId}.json`, { id: deviceId, name, at: Date.now() }).catch(() => {});
  await putJson(`${peerDir()}/host-${deviceId}.json`, { id: deviceId, name, at: Date.now() });
  clearInterval(host.beat);
  host.beat = setInterval(announce, 60e3);
  hostWatch(host.run).catch(e => { log(`测试电脑停止接收连接：${e.message}`, true); });
  log(`这台电脑是测试电脑“${name}”，共享 ${sharedFiles().length} 个文件`);
}
function hostStop() {
  host.on = false; host.run++;
  clearInterval(host.beat);
  lsSet('datapro-host', { name: host.name, on: false });
  for (const pc of host.peers.values()) pc.close();
  host.peers.clear();
  dropFile(`${peerDir()}/host-${deviceId}.json`);
  log('已停止测试电脑');
}
// wait for offers: list_folder/longpoll returns as soon as the folder changes; plain polling if it is unavailable
async function hostWatch(run) {
  const dir = hostDir();
  await dbxCall('files/create_folder_v2', { path: dir }).catch(e => { if (!/conflict/.test(e.message)) throw e; });
  let page = await dbxCall('files/list_folder', { path: dir });
  for (;;) {
    for (const e of page.entries) if (e['.tag'] === 'file' && /^offer-.+\.json$/.test(e.name)) hostAnswer(e.path_lower, run).catch(err => log(`连接请求出错：${err.message}`, true));
    if (page.has_more) { page = await dbxCall('files/list_folder/continue', { cursor: page.cursor }); continue; }
    const cursor = page.cursor;
    for (;;) {
      if (host.run !== run) return;
      try {
        const r = await fetch('https://notify.dropboxapi.com/2/files/list_folder/longpoll', { method: 'POST', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cursor, timeout: 30 }) });
        const j = await r.json();
        if (j.backoff) await sleep(j.backoff * 1000);
        if (j.changes) break;
      } catch (e) { await sleep(3000); break; }
    }
    if (host.run !== run) return;
    page = await dbxCall('files/list_folder/continue', { cursor });
  }
}
async function hostAnswer(path, run) {
  const offer = await getJson(path).catch(() => null);
  dropFile(path);
  if (!offer || host.run !== run) return;
  const pc = new RTCPeerConnection({ iceServers: ICE });
  pc.ondatachannel = e => serveChannel(e.channel);
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState) && host.peers.get(offer.client) === pc) host.peers.delete(offer.client); };
  await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await iceDone(pc);
  host.peers.get(offer.client)?.close();
  host.peers.set(offer.client, pc);
  await putJson(`${hostDir()}/answer-${offer.client}.json`, { sdp: pc.localDescription.sdp, nonce: offer.nonce });
}
function serveChannel(ch) {
  ch.binaryType = 'arraybuffer';
  ch.bufferedAmountLowThreshold = 1 << 20;
  const send = o => ch.send(JSON.stringify(o));
  let queue = Promise.resolve();   // one reply at a time, so file chunks never interleave
  ch.onmessage = ev => {
    const m = JSON.parse(ev.data);
    queue = queue.then(async () => {
      if (!host.on) return send({ t: 'err', req: m.req, msg: '那台电脑已经不是测试电脑了' });
      if (m.t === 'list') return send({ t: 'list', req: m.req, name: host.name, files: sharedFiles() });
      if (m.t !== 'get') return;
      const h = handles.get(m.id);
      if (!h || !sharedFiles().some(f => f.id === m.id)) return send({ t: 'err', req: m.req, msg: '测试电脑上已经没有这个文件了' });
      if (await h.queryPermission({ mode: 'read' }) !== 'granted') return send({ t: 'err', req: m.req, msg: '测试电脑需要重新允许读取这个文件：在那台电脑上点一次“联机”' });
      const f = await h.getFile();
      const time = new Date(f.lastModified).toISOString();
      if (stampOf(f) === m.rev) return send({ t: 'same', req: m.req, time });
      const file = await readHandle(h);
      const buf = await file.arrayBuffer();
      send({ t: 'file', req: m.req, name: file.name, rev: stampOf(file), time: new Date(file.lastModified).toISOString() });
      for (let i = 0; i < buf.byteLength; i += CHUNK) {
        if (ch.bufferedAmount > 4 << 20) await new Promise(r => ch.addEventListener('bufferedamountlow', r, { once: true }));
        ch.send(buf.slice(i, i + CHUNK));
      }
      send({ t: 'end', req: m.req });
    }).catch(e => { try { send({ t: 'err', req: m.req, msg: e.message }); } catch (_) { /* channel gone */ } });
  };
}

// --- client side
const links = new Map();   // host id -> { ch, pending, connecting }
async function listHosts() {
  let entries;
  try { entries = await dbxList(peerDir()); } catch (e) { if (e.notFound) return []; throw e; }
  const out = [];
  for (const e of entries) {
    const m = /^host-(.+)\.json$/.exec(e.name);
    if (!m || m[1] === deviceId) continue;
    const h = await getJson(e.path_lower).catch(() => null);
    // heartbeat every minute: older than a few minutes means DataPro is closed there
    if (h) out.push({ ...h, online: Date.now() - Date.parse(e.server_modified) < 5 * 60e3 });
  }
  return out.sort((a, b) => b.online - a.online || a.name.localeCompare(b.name));
}
function connectHost(id) {
  const cur = links.get(id);
  if (cur?.ch.readyState === 'open') return Promise.resolve(cur);
  if (cur?.connecting) return cur.connecting;
  const link = { pending: new Map(), recv: null, seq: 0 };
  link.connecting = (async () => {
    const pc = new RTCPeerConnection({ iceServers: ICE });
    const ch = link.ch = pc.createDataChannel('datapro', { ordered: true });
    ch.binaryType = 'arraybuffer';
    link.pc = pc;
    await pc.setLocalDescription(await pc.createOffer());
    await iceDone(pc);
    const nonce = b64url(crypto.getRandomValues(new Uint8Array(9)));
    const dir = `${peerDir()}/${id}`, answerPath = `${dir}/answer-${deviceId}.json`;
    await putJson(`${dir}/offer-${deviceId}.json`, { sdp: pc.localDescription.sdp, client: deviceId, nonce });
    let ans = null;
    for (const until = Date.now() + 40e3; !ans; ) {
      if (Date.now() > until) { dropFile(`${dir}/offer-${deviceId}.json`); throw new Error('测试电脑没有回应：确认那台电脑开着 DataPro，并且已设为测试电脑'); }
      await sleep(1200);
      ans = await getJson(answerPath).catch(e => { if (e.notFound || e instanceof SyntaxError) return null; throw e; });
      if (ans && ans.nonce !== nonce) ans = null;   // left over from an earlier attempt
    }
    dropFile(answerPath);
    await pc.setRemoteDescription({ type: 'answer', sdp: ans.sdp });
    await new Promise((res, rej) => {
      const fail = () => rej(new Error('连不上测试电脑：这两台设备之间的网络不允许直连（常见于校园网防火墙或手机网络）'));
      const t = setTimeout(fail, 20e3);
      ch.onopen = () => { clearTimeout(t); res(); };
      pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { clearTimeout(t); fail(); } };
    });
    ch.onmessage = ev => {
      if (typeof ev.data !== 'string') { link.recv?.parts.push(ev.data); return; }
      const m = JSON.parse(ev.data);
      if (m.t === 'file') { link.recv = { m, parts: [] }; return; }
      const p = link.pending.get(m.req);
      link.pending.delete(m.req);
      if (!p) return;
      if (m.t === 'end') { const { m: head, parts } = link.recv; link.recv = null; p.resolve({ ...head, file: new File(parts, head.name) }); }
      else if (m.t === 'err') p.reject(new Error(m.msg));
      else p.resolve(m);
    };
    ch.onclose = () => {
      links.delete(id);
      for (const p of link.pending.values()) p.reject(new Error('和测试电脑的连接断了'));
      if ($('#optLive').checked && [...sources().values()].some(n => fm.nodes.get(n[0]).src.peer === id)) toast('和测试电脑的连接断了，点“刷新”重新连接');
    };
    link.connecting = null;
    return link;
  })();
  link.connecting.catch(() => { if (links.get(id) === link) links.delete(id); link.pc?.close(); });
  links.set(id, link);
  return link.connecting;
}
function askHost(link, msg, ms = 120e3) {
  const req = ++link.seq;
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { link.pending.delete(req); reject(new Error('测试电脑没有回应')); }, ms);
    link.pending.set(req, { resolve: v => { clearTimeout(t); resolve(v); }, reject: e => { clearTimeout(t); reject(e); } });
    link.ch.send(JSON.stringify({ ...msg, req }));
  });
}
async function peerFetch(src, manual) {
  // auto refresh only uses a live connection; making a new one is left to a click on 刷新
  const open = links.get(src.peer);
  if (!manual && open?.ch?.readyState !== 'open') throw Object.assign(new Error('没有连接'), { quiet: true });
  const link = await connectHost(src.peer);
  const r = await askHost(link, { t: 'get', id: src.fid, rev: src.rev });
  if (r.t === 'same') return { name: src.name, time: r.time };
  return { file: r.file, name: r.name, time: r.time, src: { ...src, rev: r.rev, name: r.name } };
}

// ------------------------------------------------------------------ refresh (Dropbox, local or 测试电脑)
// source path -> top-level node names imported from that file, in tree order
function sources() {
  const m = new Map();
  for (const { name } of fm.walk()) {
    const src = fm.nodes.get(name).src;
    if (src) { if (!m.has(src.path)) m.set(src.path, []); m.get(src.path).push(name); }
  }
  return m;
}
function srcOf(name) {
  for (let n = fm.nodes.get(name); n; n = n.parent ? fm.nodes.get(n.parent) : null) if (n.src) return n.src.path;
  return null;
}
async function fetchLatest(src, ask) {
  if (src.local) return localFetch(src, ask);
  if (src.peer) return peerFetch(src, ask);
  const { meta, file } = await dbxFetch(src.path, src.rev);
  return { file, name: meta.name, time: meta.server_modified, src: { path: meta.path_lower, rev: meta.rev } };
}
const rowsOf = names => names.reduce((s, n) => s + fm.filesRecursive(n).reduce((t, f) => t + DP.nrows(fm.current(f)), 0), 0);
// swap the nodes of one source file for its latest version, at the same place under the same names
async function refreshSource(names, auto) {
  const src = fm.nodes.get(names[0]).src;
  const files = names.flatMap(n => fm.filesRecursive(n));
  if (auto && files.some(f => fm.nodes.get(f).modified)) return { skipped: true };
  const r = await fetchLatest(src, !auto);
  const kind = src.local ? 'local' : src.peer ? 'peer' : 'dropbox';
  if (!r.file) return { unchanged: r.time, kind };
  const p = await parseFile(r.file);
  const parent = fm.nodes.get(names[0]).parent;
  const at = fm.siblings(names[0]).indexOf(names[0]);
  const rows = rowsOf(names), open = new Set(state.open);
  const edited = files.some(f => fm.nodes.get(f).modified);
  files.forEach(f => state.points.delete(f));
  names.forEach(n => fm.deleteItem(n));
  const before = new Set(fm.nodes.keys());
  p.add(parent);
  const top = topAdded(before);
  const nsrc = src.renames ? { ...r.src, renames: src.renames } : r.src;
  top.forEach((n, i) => { fm.nodes.get(n).src = nsrc; fm.moveItem(n, parent, at + i); });
  applyRenames(top.flatMap(n => fm.filesRecursive(n)), src.renames);
  state.open = new Set([...open].filter(n => fm.nodes.has(n)));
  return { name: r.name, added: rowsOf(top) - rows, edited, time: r.time, kind };
}
const whereOf = r => ({ local: '文件', peer: '测试电脑上', dropbox: 'Dropbox 上' })[r.kind];
let refreshing = false;
async function refreshSources(auto = false) {
  if (refreshing) return;
  const groups = sources();
  const paths = new Set(state.selected.length ? selectedFiles().map(srcOf).filter(Boolean) : groups.keys());
  if (!paths.size) {
    if (!auto) toast(canPickFiles ? '用“导入”“Dropbox”或“联机”导入的文件才能刷新' : '用“Dropbox”或“联机”导入的文件才能刷新');
    return;
  }
  refreshing = true;
  $('#btnRefresh').disabled = true;
  const done = [];
  let skipped = 0, failed = 0, problem = null, unchanged = null;
  try {
    for (const p of paths) {
      try {
        // auto refresh never throws away deleted points or symmetrizing
        const r = await refreshSource(groups.get(p), auto);
        if (r.skipped) skipped++;
        else if (r.unchanged) { if (!unchanged || r.unchanged > unchanged.unchanged) unchanged = r; }
        else done.push(r);
      } catch (e) {
        if (e.login || (e.permission && auto)) { problem = e; break; }
        if (e.quiet) continue;
        failed++;
        const gone = e.notFound || e.name === 'NotFoundError';
        log(`刷新 ${fm.nodes.get(groups.get(p)[0]).name} 失败：${gone ? '找不到这个文件了' : e.message}`, true);
      }
    }
  } finally { refreshing = false; $('#btnRefresh').disabled = false; }
  if (done.length) {
    renderTree(); updateColumns(); plot(); save();
    log('已刷新：' + done.map(d => `${d.name}（${d.added >= 0 ? '+' : ''}${d.added} 行，${whereOf(d)} ${fmtClock(d.time)} 的版本${d.edited ? '，之前的修改已丢弃' : ''}）`).join('，'));
  } else if (!auto && !problem) {
    // say how old the copy is, so a lagging sync is told apart from a failed refresh
    const msg = failed ? '刷新失败，详情见底部记录' : skipped ? '改过的文件不会自动刷新'
      : `没有新数据：${whereOf(unchanged)}还是 ${fmtClock(unchanged.unchanged)} 的版本`;
    toast(msg); log(msg, failed > 0);
  }
  if (problem) {
    if (auto) { $('#optLive').checked = false; setLive(false); }
    if (problem.permission) toast('先点一次“刷新”，允许读取文件，再打开自动刷新');
    else dbxProblem(problem);
  }
}

// ------------------------------------------------------------------ HDF5 via h5wasm
let h5Ready = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('无法加载 ' + src.split('/').pop()));
    document.head.append(s);
  });
}
function h5lib() {
  if (!h5Ready) h5Ready = (async () => {
    await loadScript('https://cdn.jsdelivr.net/npm/h5wasm@0.10.3/dist/iife/h5wasm.js');
    const lib = window.h5wasm.default || window.h5wasm;
    const Module = await lib.ready;
    const dir = Module.get_plugin_search_paths()[0];
    Module.FS.mkdirTree(dir);
    const resp = await fetch('h5plugins/libH5Zblosc.wasm');
    if (!resp.ok) throw new Error('blosc 解压插件没有加载成功');
    Module.FS.writeFile(`${dir}/libH5Zblosc.so`, new Uint8Array(await resp.arrayBuffer()));
    return { lib, Module };
  })().catch(e => { h5Ready = null; throw e; });
  return h5Ready;
}
async function readH5(buf, base) {
  const { lib, Module } = await h5lib();
  const path = `/in_${Date.now()}.h5`;
  Module.FS.writeFile(path, buf);
  const f = new lib.File(path, 'r');
  try { return DP.readHdfProject(f, base); }
  finally { f.close(); Module.FS.unlink(path); }
}

$('#btnRename').onclick = async () => {
  if (state.selected.length !== 1) { toast('请只选一个文件或文件夹'); return; }
  const old = state.selected[0];
  const r = await sheet('重命名', null, `<fieldset><input type="text" name="name" id="renameInput" value="${esc(old)}" autocomplete="off"></fieldset>`);
  if (!r) return;
  const name = formVal(r.form, 'name').trim();
  if (!name || name === old) return;
  if (!fm.rename(old, name)) { toast('这个名字已经被占用'); return; }

  state.selected = [name];
  log(`已重命名：${old} → ${name}`);

};

// ------------------------------------------------------------------ column names
// Renames live in DataPro only; the original files are never written. Files that can be refreshed keep
// their renames in src.renames (original name -> shown name) so a fresh read gets the same names again.
function renameInTable(t, from, to) {
  const data = {};
  const columns = t.columns.map(c => { const n = c === from ? to : c; data[n] = t.data[c]; return n; });
  return { columns, data };
}
// true when the file had `from` and now shows `to`
function renameInFile(f, from, to) {
  const n = fm.nodes.get(f), cur = fm.current(f);
  if (!cur.columns.includes(from) || cur.columns.includes(to)) return false;
  for (const k of ['data', 'modified'])
    if (n[k] && n[k].columns.includes(from) && !n[k].columns.includes(to)) n[k] = renameInTable(n[k], from, to);
  return true;
}
function applyRenames(files, renames) {
  for (const [orig, shown] of Object.entries(renames || {})) files.forEach(f => renameInFile(f, orig, shown));
}
async function renameColumnDialog() {
  const files = selectedFiles();
  if (!files.length) { toast('先选文件'); return; }
  const cols = [...new Set(files.flatMap(f => fm.current(f).columns))];
  const pre = cols.includes(state.y) ? state.y : cols[0];
  const r = await sheet('改列名', `只改 DataPro 里的这 ${files.length} 个文件，不会动原始数据文件。`,
    `<div class="grid2"><label>原列名<select name="from">${cols.map(c => `<option value="${esc(c)}"${c === pre ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label>新列名<input type="text" name="to" id="renameColTo" value="${esc(pre)}" autocomplete="off"></label></div>`,
    [{ label: '取消', value: null }, { label: '改名', value: 'ok', primary: true }],
    scrim => {
      const sel = scrim.querySelector('[name=from]'), inp = scrim.querySelector('#renameColTo');
      sel.onchange = () => { inp.value = sel.value; inp.select(); };
      inp.select();
    });
  if (!r) return;
  const from = formVal(r.form, 'from'), to = formVal(r.form, 'to').trim();
  if (!to || to === from) return;
  let done = 0, clash = 0;
  for (const f of files) {
    if (!fm.current(f).columns.includes(from)) continue;
    if (renameInFile(f, from, to)) done++; else clash++;
  }
  // remember the rename on each refreshable source, keyed by the name in the original file
  const groups = sources();
  for (const path of new Set(files.map(srcOf).filter(Boolean))) {
    const names = groups.get(path);
    const old = fm.nodes.get(names[0]).src.renames || {};
    const orig = Object.keys(old).find(k => old[k] === from) ?? from;
    const next = { ...old };
    if (orig === to) delete next[orig]; else next[orig] = to;
    names.forEach(n => { fm.nodes.get(n).src = { ...fm.nodes.get(n).src, renames: next }; });
  }
  if (done && state.x === from) state.x = to;
  if (done && state.y === from) state.y = to;
  log(`${from} → ${to}：改了 ${done} 个文件${clash ? `，${clash} 个文件已经有叫 ${to} 的列，没改` : ''}`, clash > 0);
  if (clash) toast(`${clash} 个文件已有“${to}”列，没改`);
  renderTree(); updateColumns(); plot(); save();
}
$('#btnRenameCol').onclick = renameColumnDialog;
