async function symDialog(kind) {
  if (!needXY()) return;
  const anti = kind === 'anti';
  const files = selectedFiles();
  const r = await sheet(anti ? '反对称化' : '对称化',
    `${anti ? '(f(x) − f(−x))/2' : '(f(x) + f(−x))/2'}，X = <b>${esc(state.x)}</b>，Y = <b>${esc(state.y)}</b>，共 ${files.length} 个文件。结果作为新列 <b>${anti ? 'antisymmetrized_' : 'symmetrized_'}${esc(state.y)}</b> 加到文件里。`,
    `<fieldset><legend>数据类型</legend>${radios('sweep', [['hysteretic', '滞回（来回扫，先平均上扫和下扫）'], ['non_hysteretic', '单向扫描']], 'hysteretic')}</fieldset>
     <fieldset><legend>插值方法</legend>${radios('method', [['linear', '线性插值'], ['cubic', '三次样条']], 'linear')}</fieldset>
     <fieldset><legend>范围（留空 = 自动）</legend><div class="grid2">
       <label>X 最小值<input type="text" inputmode="decimal" name="xmin" id="symXmin" placeholder="auto"></label>
       <label>X 最大值<input type="text" inputmode="decimal" name="xmax" id="symXmax" placeholder="auto"></label></div></fieldset>`,
    [{ label: '取消', value: null }, { label: '应用', value: 'ok', primary: true }]);
  if (!r) return;
  const rng = v => { v = (v || '').trim(); if (!v || v.toLowerCase() === 'auto') return 'auto'; const n = Number(v); if (!Number.isFinite(n)) throw new Error('范围要填数字或留空'); return n; };
  let xmin, xmax;
  try { xmin = rng(formVal(r.form, 'xmin')); xmax = rng(formVal(r.form, 'xmax')); } catch (e) { toast(e.message); return; }
  const sweep = formVal(r.form, 'sweep'), method = formVal(r.form, 'method');
  let ok = 0, col = '';
  for (const f of files) {
    const t = fm.current(f);
    if (!t.columns.includes(state.x) || !t.columns.includes(state.y)) { log(`${f}：没有 ${state.x} 或 ${state.y} 列，已跳过`); continue; }
    try {
      const res = (anti ? DP.antisymmetrize : DP.symmetrize)(t, state.x, state.y, sweep, method, xmin, xmax);
      fm.update(f, res.table); col = res.column; ok++;
      log(`${f}：|${state.x}| ≤ ${+res.range.toPrecision(6)} 范围内有结果，范围外为空`);
      if (res.single) log(`${f}：没分出上扫和下扫两段，已按单向扫描处理`);
    } catch (e) { log(`${f}：${e.message}`, true); }
  }
  if (ok) {
    state.y = col;
    log(`${anti ? '反对称化' : '对称化'}完成：${ok} 个文件，新列 ${col}`);
    toast(`已添加列 ${col}`);
  }
  renderTree(); updateColumns(); plot(); save();
}

$('#btnSplit').onclick = async () => {
  const files = selectedFiles();
  if (!files.length) { toast('先选要拆分的文件'); return; }
  const cols = columnsOf(files);
  const guess = cols.find(c => ['field', 'b', 'magnetic', 'h', 'hall'].some(k => c.toLowerCase().includes(k))) || state.x || cols[0];
  const opt = (c, v) => `<option value="${esc(c)}"${c === v ? ' selected' : ''}>${esc(c)}</option>`;
  const r = await sheet('拆分 sweep', `按扫描方向的变化，把每个文件拆成多段。共 ${files.length} 个文件，原文件会被拆出来的各段替换。`,
    `<fieldset><legend>扫描量所在的列</legend><select name="field" id="splitField">${cols.map(c => opt(c, guess)).join('')}</select></fieldset>
     <fieldset><legend>参数列（可选，写进文件名）</legend><select name="param" id="splitParam"><option value="">无</option>${cols.map(c => opt(c, '')).join('')}</select></fieldset>
     <div class="grid2" style="margin-bottom:14px">
       <label>参数缩写（如 T、G）<input type="text" name="abbrev" id="splitAbbrev" autocomplete="off"></label>
       <label>每段最少点数<input type="number" name="min" id="splitMin" value="10" min="1" inputmode="numeric"></label></div>`,
    [{ label: '取消', value: null }, { label: '拆分', value: 'ok', primary: true }]);
  if (!r) return;
  const field = formVal(r.form, 'field'), param = formVal(r.form, 'param'), abbrev = formVal(r.form, 'abbrev').trim();
  const minPoints = Math.max(1, parseInt(formVal(r.form, 'min'), 10) || 10);
  let split = 0;
  const created = [];
  for (const f of files) {
    const t = fm.current(f);
    if (!t || !t.columns.includes(field)) continue;
    const res = DP.splitSweeps(t, f, field, { minPoints, paramCol: param, paramAbbrev: abbrev });
    if (!res.segments.length) { log(`${f}：${res.reason}`); continue; }
    const parent = fm.nodes.get(f).parent;
    const sib = fm.siblings(f);
    let pos = sib.indexOf(f);
    for (const s of res.segments) {
      const node = fm.addFile(s.name, s.table, parent);
      fm.moveItem(node.name, parent, ++pos);
      created.push(node.name);
    }
    state.points.delete(f);
    fm.deleteItem(f);
    log(`${f} 拆成 ${res.segments.length} 段`);
    split++;
  }
  if (split) { state.selected = created; toast(`拆分了 ${split} 个文件，共 ${created.length} 段`); }
  else toast('没有检测到多段 sweep');
  onSelectionChange(); save();
};

const downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, data) {
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename, data }); log(`已保存：${filename}`); toast(`已保存 ${filename}`); }
    catch (e) {
      if (e && e.code === 'declined') toast('已取消保存');
      else { log(`保存失败：${e && (e.message || e.code)}`, true); toast('保存失败，详见记录'); }
    }
    return;
  }
  const ext = filename.split('.').pop().toLowerCase();
  const type = { csv: 'text/csv', json: 'application/json', zip: 'application/zip',
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }[ext] || 'application/octet-stream';
  const file = new File([data], filename, { type });
  // iPhone/iPad: the share sheet ("存储到文件" -> Dropbox). It needs a fresh tap, because building
  // a zip or workbook first uses up the tap that started the export.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await sheet('文件已生成', `<b>${esc(filename)}</b>。点"存储"后在分享面板里选"存储到文件"，就能放进 Dropbox。`, '',
      [{ label: '取消', value: null }, { label: '存储', value: 'ok', primary: true }],
      (scrim, close) => {
        scrim.querySelector('form').onsubmit = async e => {
          e.preventDefault();
          close(null);
          try { await navigator.share({ files: [file] }); log(`已保存：${filename}`); }
          catch (err) { if (err && err.name !== 'AbortError') { log(`保存失败：${err.message}`, true); toast('保存失败，详见记录'); } }
        };
      });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  log(`已保存：${filename}`);
}

async function exportProject() { await saveFile(`datapro_${stamp()}.json`, DP.projectToJson(fm)); }
async function exportCsv() {
  const files = selectedFiles();
  if (files.length === 1) { await saveFile(`${safeName(files[0].replace(/\.[^.]+$/, ''))}.csv`, DP.toCsv(fm.current(files[0]))); return; }
  await withBusy('正在打包…', async () => {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = new JSZip(), used = new Set();
    for (const f of files) {
      let n = safeName(f) + '.csv', k = 1;
      while (used.has(n)) n = `${safeName(f)}_${k++}.csv`;
      used.add(n);
      zip.file(n, DP.toCsv(fm.current(f)));
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    await saveFile(`datapro_${stamp()}.zip`, blob);
  });
}
async function exportXlsx() {
  const files = selectedFiles();
  const { cols, headers } = DP.xyColumns(files, state.x, state.y, n => fm.current(n));
  if (!cols.length) { toast(`选中的文件里没有 ${state.x} / ${state.y} 列`); return; }
  await withBusy('正在生成 Excel…', async () => {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const m = Math.max(...cols.map(c => c.length));
    const aoa = [headers];
    for (let i = 0; i < m; i++) aoa.push(cols.map(c => (i < c.length && Number.isFinite(c[i]) ? c[i] : (typeof c[i] === 'string' ? c[i] : null))));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Combined_Data');
    const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    await saveFile(`${safeName(state.x)}_${safeName(state.y)}_${stamp()}.xlsx`, new Blob([out]));
  });
}

    <fieldset data-single><legend>Y 轴参数值</legend>
      ${radios('ySource', [['from_column', '从某一列提取'], ['manual', '手动填写（逗号分隔，按下面的文件顺序）']], S.ySource)}
      <div class="grid2">
        <label>列<select name="yCol" id="map_yCol">${opts(S.yCol)}</select></label>
        <label>取值方式<select name="yAgg" id="map_yAgg">${[['max', '最大值'], ['min', '最小值'], ['mean', '平均值'], ['median', '中位数'], ['first', '第一个点']].map(([v, l]) => `<option value="${v}"${v === S.yAgg ? ' selected' : ''}>${l}</option>`).join('')}</select></label></div>
      <textarea name="yManual" id="map_yManual" placeholder="例如 -4, -3.8, -3.6 …">${esc(S.yManual)}</textarea>
      <div class="list">${files.map((f, i) => `<div>${i + 1}. ${esc(f)}</div>`).join('')}</div></fieldset>
    <details><summary>处理选项</summary>
      ${chk('sym', '对称化 R(x) = [R(x)+R(−x)]/2')}${chk('asym', '反对称化 R(x) = [R(x)−R(−x)]/2')}
      ${chk('bg', '扣除线性背景')}${chk('log', '对数：log10(|Z|)')}
      <fieldset style="margin-top:8px"><legend>信号范围（色标上下限，留空 = 不限）</legend><div class="grid2">${txt('sigMin', '最小', 'inputmode="decimal"')}${txt('sigMax', '最大', 'inputmode="decimal"')}</div></fieldset>
      <fieldset data-single><legend>各文件扫描范围不同时</legend>${radios('rangeMode', [['overlap', '只用重叠部分（交集）'], ['union_boundary', '全范围，范围外用边界值延伸'], ['union_nan', '全范围，范围外留空']], S.rangeMode)}</fieldset>
      <fieldset><legend>空值填充</legend>${radios('nanFill', [['nan', '留空'], ['zero', '填 0'], ['max', '填信号最大值'], ['min', '填信号最小值']], S.nanFill)}</fieldset>
    </details>
    <details><summary>坐标变换</summary>
      ${chk('transform', '做坐标变换')}
      <p class="note">n = (X + r·Y)/√(1+r²)，D = (−r·X + Y)/√(1+r²)，r = 扫描比例 dY/dX，n ⊥ D</p>
      <fieldset>${radios('transformMode', [['auto', '自动从数据计算 r（仅双栅模式）'], ['manual', '手动填 r']], S.transformMode)}
        <div class="grid2">${txt('transformRatio', 'r =', 'inputmode="decimal"')}</div></fieldset>
    </details>
    <details><summary>出图选项</summary>
      <fieldset data-single><legend>Y 方向</legend>${radios('yInterp', [['smooth', '插值成平滑网格'], ['discrete', '不插值，每个参数值一行']], S.yInterp)}</fieldset>
      <div class="grid2" style="margin-bottom:10px">
        <label>网格分辨率<input type="number" name="grid" id="map_grid" value="${esc(S.grid)}" min="50" max="2000" step="50" inputmode="numeric"></label>
        <label>色标<select name="cmap" id="map_cmap">${CMAP_NAMES.map(n => `<option${n === S.cmap ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        ${txt('xlabel', 'X 轴标题')}${txt('ylabel', 'Y 轴标题')}${txt('zlabel', '色标标题')}<span></span>
        ${txt('vmin', 'vmin（留空自动）', 'inputmode="decimal"')}${txt('vmax', 'vmax（留空自动）', 'inputmode="decimal"')}
      </div>
    </details>`;
  const r = await sheet('2D mapping', `${files.length} 个文件`, body,
    [{ label: '取消', value: null }, { label: '生成', value: 'ok', primary: true }],
    scrim => {
      const form = scrim.querySelector('form');
      const sync = () => {
        const dual = form.elements.mode.value === 'dual_gate';
        form.querySelectorAll('[data-dual]').forEach(e => { e.hidden = !dual; });
        form.querySelectorAll('[data-single]').forEach(e => { e.hidden = dual; });
      };
      form.addEventListener('change', sync);
      sync();
    });
  if (!r) return;
  const f = r.form, v = n => f.elements[n].value, c = n => f.elements[n].checked;
  const s = {
    mode: v('mode'), xCol: v('xCol'), zCol: v('zCol'), yColDual: v('yColDual'), ySource: v('ySource'), yManual: v('yManual'),
    yCol: v('yCol'), yAgg: v('yAgg'), sym: c('sym'), asym: c('asym'), bg: c('bg'), log: c('log'), sigMin: v('sigMin'), sigMax: v('sigMax'),
    rangeMode: v('rangeMode'), nanFill: v('nanFill'), transform: c('transform'), transformMode: v('transformMode'),
    transformRatio: v('transformRatio'), grid: Number(v('grid')) || 600, yInterp: v('yInterp'), cmap: v('cmap'),
    xlabel: v('xlabel'), ylabel: v('ylabel'), zlabel: v('zlabel'), vmin: v('vmin'), vmax: v('vmax'),
  };
  try { await kv('put', 'mapset', JSON.stringify(s)); } catch (e) { /* keep going without remembering */ }
  // only the columns the computation reads go to the worker
  const need = [...new Set([s.xCol, s.zCol, s.mode === 'dual_gate' ? s.yColDual : (s.ySource === 'from_column' ? s.yCol : null)].filter(Boolean))];
  const payload = files.map(name => {
    const t = fm.current(name), cols = {};
    for (const cn of need) if (t.columns.includes(cn)) cols[cn] = Float64Array.from(t.data[cn], DP.toNum);
    return { name, cols };
  });
  let out;
  try {
    out = await withBusy(`正在生成 mapping（${files.length} 个文件）…`, () => runMapping(payload, s));
  } catch (e) {
    (e.logs || []).forEach(m => log(m));
    log(`2D mapping 失败：${e.message}`, true);
    toast('生成失败，详见记录');
    return;
  }
  out.logs.forEach(m => log(m));
  log(`2D mapping 完成：${out.result.nx} × ${out.result.ny}`);
  openMapView(out.result, s);
};

const WORKER_MAIN = `
self.onmessage = e => {
  const { id, files, settings } = e.data, logs = [];
  try {
    const r = DP.mapping.computeMapping(files, settings, m => logs.push(m));
    self.postMessage({ id, ok: true, result: r, logs }, [r.Z.buffer]);
  } catch (err) { self.postMessage({ id, ok: false, error: String((err && err.message) || err), logs }); }
};`;
let mapWorker = null, mapJob = 0;
function computeHere(files, s) {
  const logs = [];
  return { result: DP.mapping.computeMapping(files, s, m => logs.push(m)), logs };
}
function runMapping(files, s) {
  if (!mapWorker) {
    try {
      const src = ['src-delaunator', 'src-core', 'src-mapping'].map(id => document.getElementById(id).textContent).join('\n;\n') + WORKER_MAIN;
      mapWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    } catch (e) { mapWorker = false; }
  }
  if (!mapWorker) return new Promise(res => setTimeout(res, 30)).then(() => computeHere(files, s));
  return new Promise((resolve, reject) => {
    const id = ++mapJob, w = mapWorker;
    const done = () => { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); };
    const onMsg = e => {
      if (e.data.id !== id) return;
      done();
      if (e.data.ok) resolve(e.data);
      else reject(Object.assign(new Error(e.data.error), { logs: e.data.logs }));
    };
    // a worker that cannot start (blocked by the page's security policy) -> compute on the page instead
    const onErr = () => { done(); mapWorker = false; try { resolve(computeHere(files, s)); } catch (err) { reject(err); } };
    w.addEventListener('message', onMsg);
    w.addEventListener('error', onErr);
    w.postMessage({ id, files, settings: s });
  });
}

function openMapView(M, s) {
  const MP = DP.mapping;
  const v = {
    swapped: false, templateName: s.cmap, template: MP.lutFromHex(DP_CMAPS[s.cmap] || DP_CMAPS.RdBu_r),
    mode: 'template', low: 0, high: 1, useMid: true, midPos: 0.5, colors: {},
    vmin: M.vmin, vmax: M.vmax, zoomed: false,
  };
  const fromTemplate = () => {
    v.colors.Low = MP.sample(v.template, v.low);
    v.colors.Mid = MP.sample(v.template, 0.5 * (v.low + v.high));
    v.colors.High = MP.sample(v.template, v.high);
  };
  fromTemplate();
  const lut = () => {
    const base = v.mode === 'custom' ? MP.customLut(v.colors.Low, v.colors.High, v.useMid ? v.colors.Mid : null, v.midPos) : v.template;
    return MP.truncateLut(base, v.low, v.high);
  };

  const root = document.createElement('div');
  root.className = 'mapview';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-label', '2D mapping');
  const colorRow = k => `<div class="colorrow" data-key="${k}"><span>${{ Low: '低', Mid: '中', High: '高' }[k]}</span>
    <input type="color" id="mc_${k}" aria-label="${k} 颜色"><input type="text" id="mcrgb_${k}" aria-label="${k} RGB" placeholder="R,G,B">
    <input type="text" id="mchex_${k}" aria-label="${k} 十六进制" placeholder="#RRGGBB"></div>`;
  root.innerHTML = `
    <div class="mapbar"><h3>2D mapping</h3>
      <button class="btn small" type="button" id="mvSwap">交换 X/Y</button>
      <button class="btn small" type="button" id="mvReset">复位视图</button>
      <button class="btn small" type="button" id="mvClose">关闭</button></div>
    <div class="mapplot"><div id="mapPlot"></div></div>
    <div class="mapctl">
      <div class="ctlcard"><h4>色标范围</h4>
        <div class="rangerow"><span>低</span><input type="range" id="mvLow" min="0" max="1" step="0.01"><input type="text" id="mvLowT" inputmode="decimal" aria-label="低端"></div>
        <div class="rangerow"><span>高</span><input type="range" id="mvHigh" min="0" max="1" step="0.01"><input type="text" id="mvHighT" inputmode="decimal" aria-label="高端"></div>
        <div class="preview" id="mvPreview"></div>
        <div class="inline">vmin <input type="text" id="mvVmin" inputmode="decimal"> vmax <input type="text" id="mvVmax" inputmode="decimal">
          <button class="btn small" type="button" id="mvAutoV">自动（2%–98%）</button></div></div>
      <div class="ctlcard"><h4>颜色</h4>
        <div class="inline"><label class="chk"><input type="radio" name="mvMode" value="template" checked> 模板</label>
          <select id="mvTemplate">${CMAP_NAMES.map(n => `<option${n === s.cmap ? ' selected' : ''}>${n}</option>`).join('')}</select>
          <label class="chk"><input type="radio" name="mvMode" value="custom"> 自定义</label>
          <label class="chk"><input type="checkbox" id="mvUseMid" checked> 用中间色</label></div>
        ${colorRow('Low')}${colorRow('Mid')}${colorRow('High')}
        <div class="rangerow"><span>中点</span><input type="range" id="mvMidPos" min="0.01" max="0.99" step="0.01"><input type="text" id="mvMidPosT" inputmode="decimal" aria-label="中点位置"></div>
        <div class="inline">中间色对应 Z = <input type="text" id="mvMidZ" inputmode="decimal"><button class="btn small" type="button" id="mvMidSet">设定</button>
          <button class="btn small" type="button" id="mvFromTpl">从模板取色</button></div>
        <div class="inline"><button class="btn small" type="button" id="mvLoadPal">载入 .pal</button>
          <button class="btn small" type="button" id="mvSavePal">导出色标 .pal（Origin）</button>
          <input type="file" id="mvPalFile" hidden></div></div>
      <div class="ctlcard"><h4>导出</h4>
        <div class="inline"><button class="btn small" type="button" id="mvXlsx">数据 Excel</button>
          <button class="btn small" type="button" id="mvCsv">数据 CSV</button>
          <button class="btn small" type="button" id="mvPng">图片 PNG</button>
          <button class="btn small" type="button" id="mvSvg">图片 SVG</button></div></div>
    </div>`;
  document.body.append(root);
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  const q = id => root.querySelector('#' + id);
  const el = q('mapPlot');
  const close = () => { Plotly.purge(el); root.remove(); document.body.style.overflow = prevOverflow; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.scrim')) close(); };
  document.addEventListener('keydown', onKey);
  q('mvClose').onclick = close;

  // matrix as displayed: rows sorted by y (discrete maps keep the file order otherwise), optional swap
  function display() {
    const { xi, yi, Z, nx, ny } = M;
    const order = Array.from(yi, (_, j) => j).sort((a, b) => yi[a] - yi[b]);
    const ys = order.map(j => yi[j]);
    const cell = (j, i) => { const z = Z[j * nx + i]; return Number.isNaN(z) ? null : z; };
    if (!v.swapped) return { x: Array.from(xi), y: ys, z: order.map(j => Array.from({ length: nx }, (_, i) => cell(j, i))), xl: s.xlabel, yl: s.ylabel };
    return { x: ys, y: Array.from(xi), z: Array.from({ length: nx }, (_, i) => order.map(j => cell(j, i))), xl: s.ylabel, yl: s.xlabel };
  }
  let shown = null;
  function render(full) {
    const ink = cssVar('--ink'), muted = cssVar('--muted');
    if (full || !shown) shown = display();
    const scale = MP.plotlyScale(lut());
    q('mvPreview').style.background = `linear-gradient(to right, ${scale.filter((_, i) => i % 16 === 0 || i === 255).map(([p, c]) => `${c} ${(p * 100).toFixed(1)}%`).join(',')})`;
    const ax = t => ({ title: { text: t, font: { size: 13 } }, color: ink, linecolor: muted, mirror: true, ticks: 'outside', tickcolor: muted,
      showgrid: false, zeroline: false, exponentformat: 'e', automargin: true });
    Plotly.react(el, [{
      type: 'heatmap', x: shown.x, y: shown.y, z: shown.z, zmin: v.vmin, zmax: v.vmax, colorscale: scale, zsmooth: false,
      colorbar: { title: { text: M.zlabel, side: 'right' }, tickfont: { color: ink }, outlinewidth: 0, thickness: 14 },
      hovertemplate: `${esc(shown.xl)}=%{x:.5g}<br>${esc(shown.yl)}=%{y:.5g}<br>${esc(M.zlabel)}=%{z:.5g}<extra></extra>`,
    }], {
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { family: cssVar('--font'), color: ink, size: 12 },
      margin: { l: 60, r: 10, t: 12, b: 48 }, xaxis: ax(shown.xl), yaxis: ax(shown.yl), dragmode: 'pan', uirevision: v.swapped ? 's' : 'n',
      hoverlabel: { font: { family: cssVar('--mono') } },
    }, { responsive: true, displayModeBar: false, scrollZoom: true, doubleClick: 'reset' });
  }
  const resetView = () => { v.zoomed = false; Plotly.relayout(el, { 'xaxis.autorange': true, 'yaxis.autorange': true }); };
  render(true);
  bindTouchGestures(el, { active: () => true, reset: resetView, get zoomed() { return v.zoomed; }, set zoomed(x) { v.zoomed = x; } });
  q('mvReset').onclick = resetView;
  q('mvSwap').onclick = () => { v.swapped = !v.swapped; v.zoomed = false; render(true); };

  // --- colour controls
  const num = t => { const n = Number(String(t).trim()); return Number.isFinite(n) ? n : null; };
  function syncControls() {
    q('mvLow').value = v.low; q('mvLowT').value = +v.low.toFixed(3);
    q('mvHigh').value = v.high; q('mvHighT').value = +v.high.toFixed(3);
    q('mvMidPos').value = v.midPos; q('mvMidPosT').value = +v.midPos.toFixed(4);
    q('mvVmin').value = +v.vmin.toPrecision(6); q('mvVmax').value = +v.vmax.toPrecision(6);
    root.querySelector(`input[name=mvMode][value=${v.mode}]`).checked = true;
    q('mvUseMid').checked = v.useMid;
    for (const k of ['Low', 'Mid', 'High']) {
      q('mc_' + k).value = MP.rgbHex(v.colors[k]);
      q('mcrgb_' + k).value = MP.rgbText(v.colors[k]);
      q('mchex_' + k).value = MP.rgbHex(v.colors[k]).slice(1).toUpperCase();
    }
  }
  syncControls();
  const setRange = (low, high) => { if (low === null || high === null || !(low < high) || low < 0 || high > 1) { syncControls(); return; } v.low = low; v.high = high; syncControls(); render(); };
  q('mvLow').oninput = () => setRange(Number(q('mvLow').value), v.high);
  q('mvHigh').oninput = () => setRange(v.low, Number(q('mvHigh').value));
  q('mvLowT').onchange = () => setRange(num(q('mvLowT').value), v.high);
  q('mvHighT').onchange = () => setRange(v.low, num(q('mvHighT').value));
  const setV = () => {
    const a = num(q('mvVmin').value), b = num(q('mvVmax').value);
    if (a === null || b === null || !(a < b)) { toast('vmin 要小于 vmax'); syncControls(); return; }
    v.vmin = a; v.vmax = b; render();
  };
  q('mvVmin').onchange = setV; q('mvVmax').onchange = setV;
  q('mvAutoV').onclick = () => {
    v.vmin = MP.nanPercentile(M.Z, 2); v.vmax = MP.nanPercentile(M.Z, 98);
    if (!Number.isFinite(v.vmin)) { v.vmin = 0; v.vmax = 1; }
    syncControls(); render();
  };
  root.querySelectorAll('input[name=mvMode]').forEach(r => { r.onchange = () => { v.mode = r.value; render(); }; });
  q('mvUseMid').onchange = () => { v.useMid = q('mvUseMid').checked; if (v.mode === 'custom') render(); };
  q('mvTemplate').onchange = () => {
    v.templateName = q('mvTemplate').value; v.template = MP.lutFromHex(DP_CMAPS[v.templateName]);
    v.mode = 'template'; fromTemplate(); syncControls(); render();
  };
  const useCustom = (k, rgb) => { v.colors[k] = rgb; v.mode = 'custom'; syncControls(); render(); };
  for (const k of ['Low', 'Mid', 'High']) {
    q('mc_' + k).oninput = () => useCustom(k, MP.parseColor(q('mc_' + k).value));
    q('mcrgb_' + k).onchange = () => { const c = MP.parseColor(q('mcrgb_' + k).value); if (c) useCustom(k, c); else { toast('颜色格式：R,G,B（0–255）'); syncControls(); } };
    q('mchex_' + k).onchange = () => { const c = MP.parseColor('#' + q('mchex_' + k).value.replace(/^#/, '')); if (c) useCustom(k, c); else { toast('十六进制颜色要 6 位，例如 40C0C0'); syncControls(); } };
  }
  const setMid = p => { if (p === null || p <= 0 || p >= 1) { syncControls(); return; } v.midPos = p; syncControls(); if (v.mode === 'custom' && v.useMid) render(); };
  q('mvMidPos').oninput = () => setMid(Number(q('mvMidPos').value));
  q('mvMidPosT').onchange = () => setMid(num(q('mvMidPosT').value));
  q('mvMidSet').onclick = () => {
    const z = num(q('mvMidZ').value);
    if (z === null) { toast('请填一个 Z 值'); return; }
    if (v.vmax === v.vmin || v.high <= v.low) return;
    const pos = v.low + (z - v.vmin) / (v.vmax - v.vmin) * (v.high - v.low);
    if (!(pos > 0 && pos < 1)) { toast(`Z = ${z} 不在当前色标范围内`); return; }
    v.midPos = Math.round(pos * 1e4) / 1e4; v.useMid = true; v.mode = 'custom'; syncControls(); render();
  };
  q('mvFromTpl').onclick = () => { fromTemplate(); syncControls(); if (v.mode === 'custom') render(); };
  q('mvLoadPal').onclick = () => q('mvPalFile').click();
  q('mvPalFile').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';

    try {
      v.template = MP.parsePal(new Uint8Array(await file.arrayBuffer()));
      v.templateName = file.name.replace(/\.[^.]+$/, '');
      v.mode = 'template'; v.low = 0; v.high = 1; fromTemplate(); syncControls(); render();
      log(`已载入色标：${file.name}`);
    } catch (err) { toast(err.message); }
  };
  q('mvSavePal').onclick = async () => {
    const name = `${safeName(v.mode === 'custom' ? 'custom' : v.templateName)}_${v.low.toFixed(2)}_${v.high.toFixed(2)}.pal`;
    const bytes = MP.exportPal(lut());
    if (await downloadsP) {
      // the Claude page only saves common file types, so the palette goes inside a zip
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      const zip = new JSZip(); zip.file(name, bytes);
      await saveFile(name.replace(/\.pal$/, '.zip'), await zip.generateAsync({ type: 'blob' }));
    } else await saveFile(name, bytes);
    log('Origin 色标：放进 <User Files>\\Palettes\\ 文件夹，然后在 Origin 的色标编辑器里选用');
  };

  // --- export
  const base = () => `mapping_${safeName(M.zlabel || 'Z')}_${stamp()}`;
  q('mvXlsx').onclick = async () => {
    const rows = MP.mappingMatrix(M, v.swapped).map(r => r.map(x => (typeof x === 'number' && !Number.isFinite(x) ? null : x)));
    await withBusy('正在生成 Excel…', async () => {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Sheet1');
      await saveFile(base() + '.xlsx', new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })]));
    });
  };
  q('mvCsv').onclick = () => {
    const rows = MP.mappingMatrix(M, v.swapped);
    saveFile(base() + '.csv', rows.map(r => r.map(x => (typeof x === 'number' && !Number.isFinite(x) ? '' : x)).join(',')).join('\n') + '\n');
  };
  const image = async fmt => {
    const url = await Plotly.toImage(el, { format: fmt, width: Math.max(el.clientWidth, 640), height: Math.max(el.clientHeight, 480), scale: fmt === 'png' ? 3 : 1 });
    // decode the data: URL here; fetching it can be blocked by the page's security policy
    const comma = url.indexOf(','), head = url.slice(0, comma), payload = url.slice(comma + 1);
    let blob;
    if (head.includes(';base64')) {
      const bin = atob(payload), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      blob = new Blob([bytes], { type: 'image/png' });
    } else blob = new Blob([decodeURIComponent(payload)], { type: 'image/svg+xml' });
    await saveFile(`${base()}.${fmt}`, blob);
  };
  q('mvPng').onclick = () => image('png').catch(e => toast('导出图片失败：' + e.message));
  q('mvSvg').onclick = () => image('svg').catch(e => toast('导出图片失败：' + e.message));
}

// ------------------------------------------------------------------ autosave (this browser only)
const DB = 'datapro-web', STORE = 'kv';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kv(op, key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, op === 'get' ? 'readonly' : 'readwrite');
    const st = tx.objectStore(STORE);
    const q = op === 'get' ? st.get(key) : st.put(val, key);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
let saveTimer;
async function saveNow() {
  clearTimeout(saveTimer);
  try {
    await kv('put', 'project', DP.projectToJson(fm));
    await kv('put', 'ui', JSON.stringify({ x: state.x, y: state.y, open: [...state.open], selected: state.selected,
      scaleX: $('#scaleX').value, scaleY: $('#scaleY').value, absX: $('#optAbsX').checked, absY: $('#optAbsY').checked, markers: $('#optMarkers').checked, grid: $('#optGrid').checked, legend: $('#optLegend').checked }));
    const srcs = {};
    for (const [name, n] of fm.nodes) if (n.src) srcs[name] = n.src;
    await kv('put', 'sources', JSON.stringify(srcs));
    const hs = {};
    for (const src of Object.values(srcs)) if (src.local && handles.has(src.path)) hs[src.path] = handles.get(src.path);
    await kv('put', 'handles', hs);
  } catch (e) { /* storage unavailable: the session still works */ }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }

// ------------------------------------------------------------------ example data
function exampleItems() {
  const folder = EXAMPLE;
  const items = [{ name: folder, isFolder: true, parent: null }];
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
  for (const [T, rh, hc] of [[1.5, 12, 0.42], [3.0, 11, 0.28]]) {
    const B = [], X1 = [], Hall1 = [], T1 = [];
    const n = 160;
    for (let i = 0; i <= 2 * n; i++) {
      const b = i <= n ? 3 - 6 * i / n : -3 + 6 * (i - n) / n;
      const branch = i <= n ? 1 : -1;
      const m = Math.tanh((b + branch * hc) / 0.12);
      B.push(+b.toFixed(4));
      Hall1.push(rh * b + 9 * m + 0.6 * b * b + 0.08 * rnd());
      X1.push(40 + 2.2 * b * b - 0.9 * Math.abs(m) + 0.4 * b + 0.05 * rnd());
      T1.push(T + 0.01 * rnd());
    }
    items.push({ name: `示例 Hall 回线 T=${T} K.txt`, isFolder: false, parent: folder, table: DP.makeTable(['B', 'X1', 'Hall1', 'T1'], [B, X1, Hall1, T1]) });
  }
  return items;
}

// ------------------------------------------------------------------ start
async function start() {
  let restored = false;
  try {
    const p = await kv('get', 'project');
    if (p) {
      addItems(DP.projectFromJson(p), null, true);
      const ui = JSON.parse((await kv('get', 'ui')) || '{}');
      state.x = ui.x || ''; state.y = ui.y || '';
      state.open = new Set((ui.open || []).filter(n => fm.nodes.has(n)));
      state.selected = (ui.selected || []).filter(n => fm.nodes.has(n));
      if (ui.scaleX) $('#scaleX').value = ui.scaleX;
      if (ui.scaleY) $('#scaleY').value = ui.scaleY;
      ['absX', 'absY', 'markers', 'grid', 'legend'].forEach(k => { if (k in ui) $('#opt' + k[0].toUpperCase() + k.slice(1)).checked = ui[k]; });
      for (const [name, src] of Object.entries(JSON.parse((await kv('get', 'sources')) || '{}'))) if (fm.nodes.has(name)) fm.nodes.get(name).src = src;
      for (const [k, h] of Object.entries((await kv('get', 'handles').catch(() => null)) || {})) handles.set(k, h);
      restored = fm.nodes.size > 0;
    }
  } catch (e) { /* no stored session */ }
  if (restored) log('已恢复上次的工作区');
  else {
    addItems(exampleItems(), null, true);
    state.selected = [EXAMPLE];
    state.x = 'B'; state.y = 'Hall1';
    log('载入了示例数据。点“导入”打开你自己的文件');
  }
  renderTree(); updateColumns(); plot();
  if (await dbxFinishLogin()) dbxImport();
  resumeHost();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => plot());
// redraw when the plot box changes size (rotation, split view, fonts settling)
let lastW = 0, resizeTimer;
new ResizeObserver(entries => {
  const w = Math.round(entries[0].contentRect.width);
  if (Math.abs(w - lastW) < 2) return;
  lastW = w;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.traceFiles.length) plot(); }, 120);
}).observe($('#plot'));
new MutationObserver(() => plot()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
start();
})();
