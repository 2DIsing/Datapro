<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6c80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DataPro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* what the artifact host used to provide around the page */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</head>
<body>
<title>DataPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone = one column (files, plot, tools); tablet/desktop = files+tools rail on the left, plot fills the rest. */
:root {
  --bg: #f3f5f6; --panel: #ffffff; --ink: #172026; --muted: #5a6670; --line: #d9dfe3; --soft: #e9eef1;
  --accent: #0a6c80; --accent-ink: #ffffff; --accent-soft: #d8edf1; --danger: #b42318; --mark: #e8590c;
  --font: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1316; --panel: #171c20; --ink: #e5eaed; --muted: #94a1aa; --line: #2a3238; --soft: #20272c;
  --accent: #4db3c9; --accent-ink: #06191e; --accent-soft: #163840; --danger: #f2766b; --mark: #ff8f4d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1316; --panel: #171c20; --ink: #e5eaed; --muted: #94a1aa; --line: #2a3238; --soft: #20272c;
  --accent: #4db3c9; --accent-ink: #06191e; --accent-soft: #163840; --danger: #f2766b; --mark: #ff8f4d; color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
.wrap { padding-inline: 16px; padding-block: 12px 24px; max-width: 1500px; margin: 0 auto; }

header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 4px 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font-weight: 600; font-size: 19px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 8px 12px; min-height: 40px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .seg button:focus-visible, .tree .item:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }

.layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.filescard { order: 1; } .plotcard { order: 2; } .toolscard { order: 3; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: auto 1fr; align-items: start; }
  .filescard { grid-column: 1; grid-row: 1; }
  .toolscard { grid-column: 1; grid-row: 2; }
  .plotcard { grid-column: 2; grid-row: 1 / span 2; }
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card > h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0; padding: 10px 12px 0; display: flex; align-items: center; gap: 8px; }
.card > h2 .count { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
.pad { padding: 10px 12px 12px; }
/* file tree */
.tree { max-height: 34vh; overflow: auto; padding: 4px 6px 6px; overscroll-behavior: contain; }
@media (min-width: 900px) { .tree { max-height: 52vh; } }
.tree .item { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 6px; cursor: pointer; min-height: 38px;
  user-select: none; -webkit-user-select: none; }
.tree .item:hover { background: var(--soft); }
.tree .item.sel { background: var(--accent-soft); }
.tree .tick { width: 18px; height: 18px; border: 1.5px solid var(--line); border-radius: 5px; flex: none; display: grid; place-items: center; }
.tree .item.sel .tick { background: var(--accent); border-color: var(--accent); }
.tree .item.sel .tick::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.tree .caret { width: 26px; height: 26px; border: 0; background: none; border-radius: 5px; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.tree .caret svg { width: 14px; height: 14px; transition: transform .15s; }
.tree .caret.open svg { transform: rotate(90deg); }
.tree .spacer { width: 26px; flex: none; }
.tree .name { min-width: 0; flex: 1; overflow: hidden; overflow-wrap: anywhere; line-height: 1.3;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.tree .folder .name { font-weight: 500; }
.tree .meta { font: 12px var(--mono); color: var(--muted); flex: none; }
.tree .src { width: 14px; height: 14px; color: var(--muted); flex: none; }
.tree .badge { font-size: 11px; color: var(--mark); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; flex: none; }
.empty { color: var(--muted); padding: 14px 8px; font-size: 14px; }
.treebar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 10px; border-top: 1px solid var(--line); }

/* plot */
.plotcard { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.plotbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px 0; }
.field { display: flex; align-items: center; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px;
  min-height: 36px; max-width: 100%; min-width: 0; }
select.col { width: 150px; }
#plot { height: 58vh; min-height: 300px; width: 100%; }
#plot.gesture { touch-action: none; -webkit-user-select: none; user-select: none; }
@media (min-width: 900px) { #plot { height: calc(100vh - 210px); min-height: 420px; } }
.plotfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 12px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--muted); cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.selinfo { font: 13px var(--mono); color: var(--mark); }
.plotbar .live { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.plotempty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 20px; }

.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tools .btn { justify-content: center; }
.tools .btn.wide { grid-column: 1 / -1; }

/* 2D mapping viewer: full-screen layer; plot stays on top while the colour controls scroll */
.mapview { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: auto; overscroll-behavior: contain;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.mapview .mapbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; }
.mapview .mapbar h3 { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; }
.mapview .mapplot { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 0 16px 6px; }
.mapview #mapPlot { height: 52vh; min-height: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; touch-action: none; }
@media (min-width: 900px) { .mapview #mapPlot { height: 62vh; } }
.mapview .mapctl { padding: 4px 16px 24px; display: grid; gap: 12px; max-width: 900px; }
.mapview .ctlcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 10px; min-width: 0; }
.mapview .ctlcard h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mapview .rangerow { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; font-size: 14px; }
.mapview .rangerow input[type=range] { width: 100%; accent-color: var(--accent); }
.mapview .preview { height: 16px; border-radius: 4px; border: 1px solid var(--line); }
.mapview .colorrow { display: grid; grid-template-columns: 2.6em 44px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; font-size: 14px; }
.mapview .colorrow input[type=color] { width: 44px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; }
.mapview .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.mapview .inline input[type=text] { width: 7.5em; }
.sheet textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--panel); font: 13px var(--mono); }
.sheet .grid2 select { width: 100%; }
.sheet details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
.sheet details summary { cursor: pointer; font-size: 14px; font-weight: 500; }
.sheet details[open] summary { margin-bottom: 8px; }
.sheet .chkline { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
.sheet .chkline input { width: 18px; height: 18px; accent-color: var(--accent); }

.status { font-size: 13px; color: var(--muted); padding: 8px 2px 0; display: flex; gap: 8px; align-items: baseline; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.status.err .dot { background: var(--danger); }
.status button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; margin-left: auto; flex: none; }
.log { font: 12px/1.5 var(--mono); color: var(--muted); max-height: 180px; overflow: auto; white-space: pre-wrap; padding: 6px 2px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; max-height: 88vh; overflow: auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.sheet fieldset { border: 0; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; min-width: 0; }
.sheet legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 4px; }
.sheet label.opt { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sheet label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.sheet label.opt input { accent-color: var(--accent); }
.sheet .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sheet .grid2 label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
.sheet .list { font: 13px var(--mono); background: var(--soft); border-radius: 8px; padding: 8px 10px; max-height: 160px; overflow: auto; }
.sheet .list div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .menu { display: grid; gap: 8px; }
.sheet .menu .btn { justify-content: flex-start; min-height: 48px; }
.sheet .menu .btn small { color: var(--muted); margin-left: auto; font-size: 12px; }
.note { font-size: 13px; color: var(--muted); }
.sheet .grow { flex: 1; }
.dbxpath { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.dbxpath span { font: 13px var(--mono); color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.dbxlist { border: 1px solid var(--line); border-radius: 8px; max-height: 52vh; overflow: auto; overscroll-behavior: contain; }
.dbxlist .ent { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 44px; cursor: pointer; border-bottom: 1px solid var(--line); }
.dbxlist .ent:last-child { border-bottom: 0; }
.dbxlist .ent:hover { background: var(--soft); }
.dbxlist .ent.sel { background: var(--accent-soft); }
.dbxlist .ent svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.dbxlist .ent input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
.dbxlist .ent .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.dbxlist .ent small { font: 11px/1.35 var(--mono); color: var(--muted); text-align: right; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: 0 6px 20px rgb(0 0 0 / .2); }
.busy { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgb(0 0 0 / .25); }
.busy div { background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; border-radius: 10px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>DataPro</b><span>输运数据处理 · 网页版</span></div>
    <div class="row">
      <button class="btn primary" id="btnImport" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>导入</button>
      <button class="btn" id="btnDbx" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 12.5h7.2a2.8 2.8 0 0 0 .4-5.6 4 4 0 0 0-7.7-.9A3.3 3.3 0 0 0 4.5 12.5z"/></svg>Dropbox</button>
      <button class="btn" id="btnExport" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 13.5h11"/></svg>导出</button>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </header>

  <div class="layout">
      <section class="card filescard">
        <h2>文件 <span class="count" id="treeCount"></span></h2>
        <div class="tree" id="tree" role="tree" aria-label="文件"></div>
        <div class="treebar">
          <button class="btn small" id="btnSelAll" type="button">全选</button>
          <button class="btn small" id="btnSelNone" type="button">取消选择</button>
          <button class="btn small" id="btnFolder" type="button">新建文件夹</button>
          <button class="btn small" id="btnRename" type="button">重命名</button>
          <button class="btn small" id="btnMove" type="button">移动到</button>
          <button class="btn small danger" id="btnDelete" type="button">删除</button>
        </div>
      </section>
      <section class="card toolscard">
        <h2>处理</h2>
        <div class="pad tools">
          <button class="btn" id="btnSym" type="button">对称化</button>
          <button class="btn" id="btnAnti" type="button">反对称化</button>
          <button class="btn" id="btnSplit" type="button">拆分 sweep</button>
          <button class="btn" id="btnMerge" type="button">合并 sweep</button>
          <button class="btn" id="btnReset" type="button">还原数据</button>
          <button class="btn" id="btnCopy" type="button">复制 X/Y</button>
          <button class="btn wide" id="btnMap" type="button">2D mapping</button>
        </div>
      </section>

    <section class="card plotcard">
      <div class="plotbar">
        <label class="field"><span>X</span><select class="col" id="selX"></select></label>
        <label class="field"><span>Y</span><select class="col" id="selY"></select></label>
        <label class="field"><span>X 轴</span><select id="scaleX"><option value="linear">线性</option><option value="log">对数</option></select></label>
        <label class="field"><span>Y 轴</span><select id="scaleY"><option value="linear">线性</option><option value="log">对数</option></select></label>
        <label class="chk"><input type="checkbox" id="optMarkers" checked>点</label>
        <label class="chk"><input type="checkbox" id="optGrid" checked>网格</label>
        <label class="chk"><input type="checkbox" id="optLegend" checked>图例</label>
        <span class="live" id="liveCtl">
          <button class="btn small" id="btnRefresh" type="button" title="重新读取选中文件的最新版本">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg>刷新</button>
          <label class="chk" title="每 5 秒检查一次，文件变了才重新读取"><input type="checkbox" id="optLive">自动</label>
        </span>
      </div>
      <div id="plot"></div>
      <div class="plotfoot">
        <div class="seg" id="modeSeg" role="group" aria-label="触摸操作">
          <button type="button" data-mode="gesture" aria-pressed="true">手势</button>
          <button type="button" data-mode="zoom" aria-pressed="false">框放大</button>
          <button type="button" data-mode="select" aria-pressed="false">框选</button>
          <button type="button" data-mode="lasso" aria-pressed="false">套索</button>
          <button type="button" data-mode="tap" aria-pressed="false">点选</button>
        </div>
        <button class="btn small" id="btnAuto" type="button">复位视图</button>
        <span class="selinfo" id="selInfo"></span>
        <button class="btn small danger" id="btnDelPts" type="button" hidden>删除选中点</button>
        <button class="btn small" id="btnClearPts" type="button" hidden>清除选择</button>
      </div>
    </section>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">准备就绪</span><button type="button" id="btnLog">记录</button></div>
  <div class="log" id="log" hidden></div>
</div>

<script id="src-core">
// DataPro web core: data model, file parsers and processing.
// Ported from "datapro 20260916.py"; every function mirrors the desktop one named in its comment.
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- tables
  // A table is {columns: string[], data: {col: array}}; numeric columns hold numbers (NaN for missing).

  function nrows(t) {
    return t.columns.length ? t.data[t.columns[0]].length : 0;
  }

  function makeTable(columns, colArrays) {
    const data = {};
    columns.forEach((c, i) => { data[c] = colArrays[i]; });
    return { columns: columns.slice(), data };
  }

  function cloneTable(t) {
    const data = {};
    t.columns.forEach(c => { data[c] = t.data[c].slice(); });
    return { columns: t.columns.slice(), data };
  }

  function takeRows(t, idx) {
    const data = {};
    t.columns.forEach(c => { const a = t.data[c]; data[c] = idx.map(i => a[i]); });
    return { columns: t.columns.slice(), data };
  }

  function sliceRows(t, start, end) {
    const data = {};
    t.columns.forEach(c => { data[c] = t.data[c].slice(start, end); });
    return { columns: t.columns.slice(), data };
  }

  // pd.to_numeric(errors='coerce') for one value
  function toNum(v) {
    if (typeof v === 'number') return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v === null || v === undefined) return NaN;
    const s = String(v).trim();
    if (s === '') return NaN;
    const l = s.toLowerCase();
    if (l === 'nan' || l === 'na' || l === 'null' || l === 'none') return NaN;
    if (l === 'inf' || l === '+inf' || l === 'infinity' || l === '+infinity') return Infinity;
    if (l === '-inf' || l === '-infinity') return -Infinity;
    if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return NaN;
    return Number(s);
  }

  function isMissing(v) {
    return v === null || v === undefined || (typeof v === 'number' && Number.isNaN(v));
  }

  // df.dropna(axis=1, how='all') then df.dropna(how='all')
  function dropAllNa(t, missing = isMissing) {
    const cols = t.columns.filter(c => !t.data[c].every(missing));
    const n = nrows(t);
    const keep = [];
    for (let i = 0; i < n; i++) if (!cols.every(c => missing(t.data[c][i]))) keep.push(i);
    return takeRows({ columns: cols, data: t.data }, keep);
  }

  function dedupeColumns(cols) {
    const seen = {};
    return cols.map(c => {
      if (!(c in seen)) { seen[c] = 0; return c; }
      let k = ++seen[c];
      while ((c + '.' + k) in seen) k++;
      seen[c + '.' + k] = 0;
      return c + '.' + k;
    });
  }

  // --------------------------------------------------------- text loading
  const COLUMN_INDICATORS = ['outputv', 'time', 'temp', 'volt', 'current', 'b', 't1', 't2', 'i', 'x1',
    'angle', 'hall', 'gate', 'leak'];

  function splitFields(line) {
    return line.includes('\t') ? line.split('\t') : line.trim().split(/\s+/).filter(Boolean);
  }

  // detect_data_structure
  function detectDataStructure(rawLines, maxCheckRows = 10) {
    const lines = rawLines.slice(0, maxCheckRows).map(l => l.trim());
    let header = null, headerIdx = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line) continue;
      const parts = splitFields(line);
      if (parts.length < 3) continue;
      const low = line.toLowerCase();
      if (['am', 'pm', 'frequency', 'stop at', 'hz', 'db/oct'].some(k => low.includes(k))) continue;
      let valid = 0;
      for (const part of parts) {
        const p = part.toLowerCase().trim();
        if (COLUMN_INDICATORS.some(ind => p.includes(ind))) valid++;
        else if (p.length <= 10 && p.length > 0 && /^\p{L}+$/u.test(p)) valid++;
        else if (p.length <= 8 && /\p{L}/u.test(p) && /\d/.test(p)) valid++;
      }
      if (valid >= parts.length * 0.7 && parts.length > 5) { header = parts; headerIdx = i; break; }
    }
    if (!header) return null;
    const cols = header.map(c => c.trim()).filter(Boolean);
    let start = headerIdx + 1;
    while (start < lines.length) {
      const line = lines[start];
      if (!line) { start++; continue; }
      const parts = splitFields(line);
      if (parts.length === cols.length) {
        let matches = 0;
        parts.forEach((p, i) => { if (i < cols.length && p.trim().toLowerCase() === cols[i].toLowerCase()) matches++; });
        if (matches >= cols.length * 0.8) { start++; continue; }
      }
      const numeric = parts.filter(p => !Number.isNaN(toNum(p)) || /^[+-]?(nan|inf)/i.test(p.trim())).length;
      if (numeric >= parts.length * 0.5) break;
      start++;
    }
    return { columns: cols, dataStart: start };
  }

  // raw=true keeps the strings, as pd.read_csv does before pd.to_numeric
  function rowsToTable(columns, rows, raw = false) {
    let width = 0;
    for (const r of rows) if (r.length > width) width = r.length;
    let cols = columns;
    let used = width;
    if (cols.length <= width) used = cols.length;
    else cols = cols.slice(0, width);
    const arrays = cols.map(() => []);
    for (const r of rows) for (let j = 0; j < used; j++) arrays[j].push(raw ? (r[j] === undefined ? '' : r[j]) : toNum(r[j]));
    return makeTable(dedupeColumns(cols), arrays);
  }

  // pandas' default NA strings
  const NA_STRINGS = new Set(['', '#N/A', '#N/A N/A', '#NA', '-1.#IND', '-1.#QNAN', '-NaN', '-nan', '1.#IND', '1.#QNAN',
    '<NA>', 'N/A', 'NA', 'NULL', 'NaN', 'None', 'n/a', 'nan', 'null']);
  const isRawMissing = v => (typeof v === 'string' ? NA_STRINGS.has(v.trim()) : isMissing(v));

  // csv.Sniffer-style fallback used by pd.read_csv(sep=None)
  function sniffDelimited(lines) {
    const body = lines.filter(l => l.trim() !== '');
    if (!body.length) return null;
    const sample = body.slice(0, 20);
    let best = null;
    for (const d of [',', '\t', ';', '|']) {
      const counts = sample.map(l => l.split(d).length - 1);
      if (counts[0] > 0 && counts.every(c => c === counts[0])) { best = d; break; }
    }
    const split = best ? (l => l.split(best).map(s => s.trim().replace(/^"(.*)"$/, '$1'))) : (l => l.trim().split(/\s+/));
    const header = split(body[0]).map(s => s.trim());
    const rows = body.slice(1).map(split);
    return rowsToTable(header.map((h, i) => h || 'Unnamed: ' + i), rows, true);
  }

  // load_text_file
  function parseTextFile(text) {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/);
    const det = detectDataStructure(lines);
    let t;
    if (det) {
      const sample = lines[det.dataStart] || '';
      const tab = sample.includes('\t');
      const rows = [];
      for (let i = det.dataStart; i < lines.length; i++) {
        const l = lines[i];
        if (l.trim() === '') continue;
        rows.push(tab ? l.split('\t') : l.trim().split(/\s+/));
      }
      t = rowsToTable(det.columns, rows, true);
    } else {
      t = sniffDelimited(lines);
      if (!t) throw new Error('文件里没有可读的数据行');
    }
    t = dropAllNa(t, isRawMissing);
    const clean = dedupeColumns(t.columns.map(c => String(c).trim()));
    return makeTable(clean, t.columns.map(c => t.data[c].map(toNum)));
  }

  // load_hk_file -> {runs: [{name, table}], skipped}
  function parseHkFile(text) {
    const all = text.replace(/^﻿/, '').split(/\r?\n/);
    const runNames = [];
    let dataStart = null;
    for (let i = 0; i < all.length; i++) {
      const s = all[i].trim();
      if (s === 'Below is data') { dataStart = i + 1; break; }
      if (s) runNames.push(s.split('\t')[0].trim());
    }
    if (dataStart === null) throw new Error("没有找到 'Below is data' 标记，不是 HK 文件");
    const blocks = [];
    let cur = [], inBlock = false;
    for (let i = dataStart; i < all.length; i++) {
      const line = all[i], s = line.trim();
      if (s.startsWith('GAPComment:')) {
        if (cur.length) blocks.push(cur);
        cur = ['Comment:' + s.slice('GAPComment:'.length)]; inBlock = true;
      } else if (s.startsWith('Comment:')) {
        if (cur.length) blocks.push(cur);
        cur = [line]; inBlock = true;
      } else if (s === 'GAP') {
        if (cur.length) { blocks.push(cur); cur = []; }
        inBlock = false;
      } else if (inBlock) cur.push(line);
    }
    if (cur.length) blocks.push(cur);
    if (!blocks.length) throw new Error('HK 文件里没有数据块');

    const runs = [];
    let skipped = 0;
    blocks.forEach((block, bi) => {
      const runName = bi < runNames.length ? runNames[bi] : 'run_' + (bi + 1);
      let header = null;
      const rows = [];
      for (const line of block) {
        const s = line.trim();
        if (s.startsWith('Header:')) header = s.slice(7).trim().split('\t').map(c => c.trim()).filter(Boolean);
        else if (s.startsWith('Data:')) rows.push(s.slice(5).trim().split('\t'));
        else if (header && s && !s.startsWith('Comment:')) {
          const parts = s.split('\t');
          if (parts.length >= 2) rows.push(parts);
        }
      }
      if (!header || !rows.length) { skipped++; return; }
      let t = rowsToTable(header, rows);
      const n = nrows(t), keep = [];
      for (let i = 0; i < n; i++) if (!t.columns.every(c => isMissing(t.data[c][i]))) keep.push(i);
      t = takeRows(t, keep);
      let display = 'run_' + (bi + 1);
      const parts = runName.split(/\s+/);
      for (let j = 0; j < parts.length; j++) {
        const p = parts[j];
        if (p.includes('-') && p.length >= 8 && /\d/.test(p)) {
          const tp = parts.slice(j).filter(q => q.includes('-') && /\d/.test(q));
          display = tp.length >= 2 ? `run_${bi + 1} (${tp[0]} ${tp[1]})` : `run_${bi + 1} (${tp[0]})`;
          break;
        }
      }
      runs.push({ name: display, table: t });
    });
    return { runs, skipped, blocks: blocks.length };
  }

  // ------------------------------------------------------------- HDF5 read
  // pandas/PyTables keep column lists as protocol-0 pickles: (lp0\nVname\np1\naV...
  function parsePickledStrList(s) {
    if (typeof s !== 'string') return null;
    const out = [];
    for (const m of s.matchAll(/(?:^|\n)[(at]*V([^\n]*)/g))
      out.push(m[1].replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
        .replace(/\\x([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
        .replace(/\\\\/g, '\\'));
    return out;
  }

  function attr(node, name) {
    try { const a = node.attrs[name]; return a ? a.value : undefined; } catch (e) { return undefined; }
  }

  function plainValue(v) {
    if (typeof v === 'bigint') return Number(v);
    if (typeof v === 'string') return v.replace(/\0+$/, '');
    return v;
  }

  // pandas format='table' frame stored in group g
  function readPandasTable(g) {
    const t = g.get('table');
    const rows = t.value;
    const fields = t.dtype.map(d => d[0]);
    const cols = {};
    fields.forEach((fname, fi) => {
      if (fname === 'index') return;
      const names = parsePickledStrList(attr(t, fname + '_kind')) || [fname];
      names.forEach((n, j) => {
        cols[n] = rows.map(r => {
          const cell = r[fi];
          return plainValue(Array.isArray(cell) || ArrayBuffer.isView(cell) ? cell[j] : cell);
        });
      });
    });
    const order = parsePickledStrList(attr(g, 'non_index_axes')) || Object.keys(cols);
    const columns = order.filter(c => c in cols);
    Object.keys(cols).forEach(c => { if (!columns.includes(c)) columns.push(c); });
    return makeTable(columns, columns.map(c => cols[c]));
  }

  function datasetStrings(ds) {
    return Array.from(ds.value, v => String(plainValue(v)));
  }

  // pandas format='fixed' frame stored in group g
  function readPandasFixed(g) {
    const columns = datasetStrings(g.get('axis0'));
    const n = g.get('axis1').shape[0];
    const nblocks = Number(attr(g, 'nblocks') || 0);
    const cols = {};
    for (let b = 0; b < nblocks; b++) {
      const items = datasetStrings(g.get(`block${b}_items`));
      const vds = g.get(`block${b}_values`);
      const flat = Array.from(vds.value, plainValue);
      const shape = vds.shape;
      // stored as (rows, items); "transposed" layout stores (items, rows)
      const rowMajor = shape.length === 2 && shape[0] === n && shape[1] === items.length;
      items.forEach((it, j) => {
        const a = new Array(n);
        for (let i = 0; i < n; i++) a[i] = rowMajor ? flat[i * items.length + j] : flat[j * n + i];
        cols[it] = a;
      });
    }
    const cs = columns.filter(c => c in cols);
    return makeTable(cs, cs.map(c => cols[c]));
  }

  function readPandasGroup(g) {
    const kind = attr(g, 'pandas_type');
    if (kind === 'frame_table') return readPandasTable(g);
    if (kind === 'frame') return readPandasFixed(g);
    if (g.keys().includes('table')) return readPandasTable(g);
    throw new Error('不支持的 pandas 存储格式: ' + kind);
  }

  // all pandas objects in the file, keyed like HDFStore.keys()
  function hdfStoreKeys(f) {
    const out = [];
    (function walk(g, path) {
      for (const k of g.keys()) {
        const child = g.get(k);
        if (!child || child.type !== 'Group') continue;
        const p = path + '/' + k;
        if (attr(child, 'pandas_type') !== undefined) out.push(p);
        else walk(child, p);
      }
    })(f, '');
    return out;
  }

  // load_hdf5_file -> list of {name, isFolder, parent, table} in insertion order
  function readHdfProject(f, fileBaseName) {
    const keys = hdfStoreKeys(f);
    const items = [];
    if (keys.includes('/__metadata__')) {
      const m = readPandasGroup(f.get('__metadata__'));
      const n = nrows(m);
      const rows = [];
      for (let i = 0; i < n; i++) {
        const r = {};
        m.columns.forEach(c => { r[c] = m.data[c][i]; });
        r.depth = String(r.path).split('/').length;
        r.i = i;
        rows.push(r);
      }
      const hasOrder = m.columns.includes('order');
      rows.sort((a, b) => a.depth - b.depth || (hasOrder ? a.order - b.order : 0) || a.i - b.i);
      for (const r of rows) {
        const parent = r.parent_folder ? String(r.parent_folder) : null;
        if (r.is_folder === true || r.is_folder === 1) {
          items.push({ name: String(r.name), isFolder: true, parent });
        } else {
          const safe = String(r.path).replace(/\\/g, '/').split('/').join('__').split('.').join('_').split(' ').join('_');
          const key = '/data/' + safe;
          if (keys.includes(key)) items.push({ name: String(r.name), isFolder: false, parent, table: readPandasGroup(f.get(key.slice(1))) });
        }
      }
      return { structured: true, items };
    }
    items.push({ name: fileBaseName, isFolder: true, parent: null });
    for (const k of keys) {
      if (k.startsWith('/_metadata')) continue;
      items.push({ name: k.replace(/^\/+|\/+$/g, ''), isFolder: false, parent: fileBaseName, table: readPandasGroup(f.get(k.slice(1))) });
    }
    return { structured: false, items };
  }

  // ---------------------------------------------------------- interpolation
  function argsortStable(x) {
    return x.map((v, i) => i).sort((a, b) => (x[a] - x[b]) || (a - b));
  }

  function linspace(a, b, n) {
    if (n <= 0) return [];
    if (n === 1) return [a];
    const out = new Array(n), step = (b - a) / (n - 1);
    for (let i = 0; i < n; i++) out[i] = a + i * step;
    out[n - 1] = b;
    return out;
  }

  function searchsortedRight(a, v) {
    let lo = 0, hi = a.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (a[mid] <= v) lo = mid + 1; else hi = mid; }
    return lo;
  }

  // scipy.interpolate.interp1d(kind='linear', bounds_error=False, fill_value=0);
  // scipy delegates this case to numpy.interp and fills out-of-bounds points afterwards
  function makeLinear(xIn, yIn) {
    const ord = argsortStable(xIn);
    const x = ord.map(i => xIn[i]), y = ord.map(i => yIn[i]);
    const n = x.length;
    return xn => {
      if (Number.isNaN(xn)) return NaN;
      if (n === 0 || xn < x[0] || xn > x[n - 1]) return 0;
      return npInterp(xn, x, y);
    };
  }

  // scipy.interpolate.interp1d(kind='cubic'): not-a-knot cubic spline; throws where scipy raises
  function makeCubic(xIn, yIn) {
    const ord = argsortStable(xIn);
    const x = ord.map(i => xIn[i]), y = ord.map(i => yIn[i]);
    const n = x.length;
    if (n < 4) throw new Error('cubic needs at least 4 points');
    for (let i = 1; i < n; i++) if (!(x[i] > x[i - 1])) throw new Error('duplicate x');
    const h = [];
    for (let i = 0; i < n - 1; i++) h.push(x[i + 1] - x[i]);
    // interior second-derivative equations: a M[i-1] + b M[i] + c M[i+1] = d, i = 1..n-2
    const a = new Array(n).fill(0), b = new Array(n).fill(0), c = new Array(n).fill(0), d = new Array(n).fill(0);
    for (let i = 1; i < n - 1; i++) {
      a[i] = h[i - 1]; b[i] = 2 * (h[i - 1] + h[i]); c[i] = h[i];
      d[i] = 6 * ((y[i + 1] - y[i]) / h[i] - (y[i] - y[i - 1]) / h[i - 1]);
    }
    // not-a-knot ends express M[0] and M[n-1] through their neighbours:
    //   M0 = ((h0+h1) M1 - h0 M2) / h1,  M[n-1] = ((h[n-3]+h[n-2]) M[n-2] - h[n-2] M[n-3]) / h[n-3]
    const L1 = (h[0] + h[1]) / h[1], L2 = -h[0] / h[1];
    const R1 = (h[n - 3] + h[n - 2]) / h[n - 3], R2 = -h[n - 2] / h[n - 3];
    b[1] += a[1] * L1; c[1] += a[1] * L2; a[1] = 0;
    b[n - 2] += c[n - 2] * R1; a[n - 2] += c[n - 2] * R2; c[n - 2] = 0;
    // Thomas algorithm on rows 1..n-2 (diagonally dominant after the substitution)
    const cp = new Array(n), dp = new Array(n), M = new Array(n);
    cp[1] = c[1] / b[1]; dp[1] = d[1] / b[1];
    for (let i = 2; i < n - 1; i++) {
      const m = b[i] - a[i] * cp[i - 1];
      cp[i] = c[i] / m; dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
    }
    M[n - 2] = dp[n - 2];
    for (let i = n - 3; i >= 1; i--) M[i] = dp[i] - cp[i] * M[i + 1];
    M[0] = L1 * M[1] + L2 * M[2];
    M[n - 1] = R1 * M[n - 2] + R2 * M[n - 3];
    return xn => {
      if (Number.isNaN(xn)) return NaN;
      if (xn < x[0] || xn > x[n - 1]) return 0;
      let i = searchsortedRight(x, xn) - 1;
      i = Math.min(Math.max(i, 0), n - 2);
      const hi = h[i], A = (x[i + 1] - xn) / hi, B = (xn - x[i]) / hi;
      return A * y[i] + B * y[i + 1] + ((A * A * A - A) * M[i] + (B * B * B - B) * M[i + 1]) * hi * hi / 6;
    };
  }

  function makeInterp(x, y, method) {
    if (method === 'cubic') { try { return makeCubic(x, y); } catch (e) { /* scipy raised: fall back */ } }
    return makeLinear(x, y);
  }

  // numpy.interp (xp increasing), including its handling of repeated xp values
  function npInterp(xv, xp, fp) {
    const n = xp.length;
    if (Number.isNaN(xv)) return NaN;
    if (n === 1) return fp[0];
    if (xv < xp[0]) return fp[0];
    if (xv > xp[n - 1]) return fp[n - 1];
    if (xv === xp[n - 1]) return fp[n - 1];
    const j = searchsortedRight(xp, xv) - 1;
    if (xp[j] === xv) return fp[j];
    const slope = (fp[j + 1] - fp[j]) / (xp[j + 1] - xp[j]);
    let r = slope * (xv - xp[j]) + fp[j];
    if (Number.isNaN(r)) {
      r = slope * (xv - xp[j + 1]) + fp[j + 1];
      if (Number.isNaN(r) && fp[j] === fp[j + 1]) r = fp[j];
    }
    return r;
  }

  function validXY(t, xCol, yCol) {
    const xs = t.data[xCol].map(toNum), ys = t.data[yCol].map(toNum);
    const x = [], y = [];
    for (let i = 0; i < xs.length; i++) if (!Number.isNaN(xs[i]) && !Number.isNaN(ys[i])) { x.push(xs[i]); y.push(ys[i]); }
    return { x, y, xAll: xs };
  }

  function minMax(a) {
    let lo = Infinity, hi = -Infinity;
    for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; }
    return [lo, hi];
  }

  // _sweep_directions: +1/-1 per point in measurement order, from the 5-point smoothed np.gradient
  function sweepDirections(x) {
    const n = x.length;
    if (n < 2) return new Array(n).fill(1);
    const g = x.map((v, i) => (i === 0 ? x[1] - x[0] : i === n - 1 ? x[n - 1] - x[n - 2] : (x[i + 1] - x[i - 1]) / 2));
    const w = Math.min(5, n);
    // rounding residue of a jitter that cancels out counts as "not moving"
    let gmax = 0;
    for (const v of g) if (Math.abs(v) > gmax) gmax = Math.abs(v);
    const tol = 1e-9 * gmax;
    const dir = new Array(n);
    for (let i = 0; i < n; i++) {
      // pandas rolling(w, center=True, min_periods=1).mean()
      const s = Math.max(0, i - Math.floor(w / 2)), e = Math.min(n, i - Math.floor(w / 2) + w);
      let sum = 0;
      for (let k = s; k < e; k++) sum += g[k];
      const m = sum / (e - s);
      dir[i] = Math.abs(m) <= tol ? 0 : Math.sign(m);
    }
    let last = 0;
    for (let i = 0; i < n; i++) { if (dir[i] === 0) dir[i] = last; else last = dir[i]; }
    const first = dir.find(d => d !== 0) || 1;
    return dir.map(d => (d === 0 ? first : d));
  }

  // _averaged_interp: up and down sweeps averaged on the x range both cover -> {f, lo, hi}
  function averagedInterp(x, y, sweepType, method) {
    if (sweepType === 'hysteretic') {
      const dir = sweepDirections(x);
      const upX = [], upY = [], dnX = [], dnY = [];
      dir.forEach((d, i) => { if (d > 0) { upX.push(x[i]); upY.push(y[i]); } else if (d < 0) { dnX.push(x[i]); dnY.push(y[i]); } });
      if (upX.length >= 2 && dnX.length >= 2) {
        const [ul, uh] = minMax(upX), [dl, dh] = minMax(dnX);
        const lo = Math.max(ul, dl), hi = Math.min(uh, dh);
        if (hi > lo) {
          const fUp = makeInterp(upX, upY, method), fDn = makeInterp(dnX, dnY, method);
          const xc = linspace(lo, hi, Math.min(upX.length, dnX.length));
          const yAvg = xc.map(v => (fUp(v) + fDn(v)) / 2);
          return { f: makeInterp(xc, yAvg, method), lo, hi, single: false };
        }
      }
      const [lo, hi] = minMax(x);
      return { f: makeInterp(x, y, method), lo, hi, single: true };
    }
    const [lo, hi] = minMax(x);
    return { f: makeInterp(x, y, method), lo, hi, single: false };
  }

  function withColumn(t, name, values) {
    const out = cloneTable(t);
    if (!out.columns.includes(name)) out.columns.push(name);
    out.data[name] = values;
    return out;
  }

  const isAuto = v => v === 'auto' || v === '' || v === undefined || v === null;

  // _symmetric_parts: f(g), f(-g) on g in [-R, R], R limited so both +x and -x are measured
  function symmetricParts(t, xCol, yCol, sweepType, method, xMin, xMax) {
    const { x, y, xAll } = validXY(t, xCol, yCol);
    if (x.length < 3) throw new Error('数据点不足，至少需要 3 个点');
    const { f, lo, hi, single } = averagedInterp(x, y, sweepType, method);
    if (!(lo < 0 && 0 < hi)) throw new Error(`${xCol} 的范围 [${lo}, ${hi}] 没有跨过 0，无法对称化`);
    let r = Math.min(-lo, hi);
    for (const lim of [xMin, xMax]) if (!isAuto(lim)) r = Math.min(r, Math.abs(Number(lim)));
    if (!(r > 0)) throw new Error('对称化范围为空');
    const grid = linspace(-r, r, x.length);
    return { grid, yPlus: grid.map(f), yMinus: grid.map(v => f(-v)), r, xAll, single };
  }

  // _on_original_x: back onto the file's own x, NaN outside [-r, r]
  function onOriginalX(xAll, grid, values, r) {
    return xAll.map(v => (Math.abs(v) <= r ? npInterp(v, grid, values) : NaN));
  }

  // symmetrize_data: (f(x) + f(-x))/2
  function symmetrize(t, xCol, yCol, sweepType, method, xMin, xMax) {
    const p = symmetricParts(t, xCol, yCol, sweepType, method, xMin, xMax);
    const name = 'symmetrized_' + yCol;
    const vals = p.yPlus.map((v, i) => (v + p.yMinus[i]) / 2);
    return { table: withColumn(t, name, onOriginalX(p.xAll, p.grid, vals, p.r)), column: name, range: p.r, single: p.single };
  }

  // antisymmetrize_data: (f(x) - f(-x))/2
  function antisymmetrize(t, xCol, yCol, sweepType, method, xMin, xMax) {
    const p = symmetricParts(t, xCol, yCol, sweepType, method, xMin, xMax);
    const name = 'antisymmetrized_' + yCol;
    const vals = p.yPlus.map((v, i) => (v - p.yMinus[i]) / 2);
    return { table: withColumn(t, name, onOriginalX(p.xAll, p.grid, vals, p.r)), column: name, range: p.r, single: p.single };
  }

  // --------------------------------------------------------------- split
  function fmtE2(v) {
    const [m, e] = v.toExponential(2).split('e');
    const sign = e[0] === '-' ? '-' : '+';
    const digits = e.replace(/^[+-]/, '');
    return m + 'e' + sign + (digits.length < 2 ? '0' + digits : digits);
  }

  function nanMean(a) {
    let s = 0, k = 0;
    for (const v of a) { const n = toNum(v); if (!Number.isNaN(n)) { s += n; k++; } }
    return k ? s / k : NaN;
  }

  // perform_split for one file -> {segments: [{name, table, start, end, direction}], log}
  function splitSweeps(t, name, fieldCol, opts) {
    const minPoints = opts.minPoints;
    const fieldAll = t.data[fieldCol].map(toNum);
    const keep = [];
    fieldAll.forEach((v, i) => { if (!Number.isNaN(v)) keep.push(i); });
    const df = takeRows(t, keep);
    const field = keep.map(i => fieldAll[i]);
    const n = field.length;
    if (n < minPoints * 2) return { segments: [], reason: `数据太短，至少需要 ${minPoints * 2} 个点` };

    const diff = field.map((v, i) => (i === 0 ? NaN : v - field[i - 1]));
    const w = Math.min(5, Math.floor(n / 10));
    // pandas rolling(window=w, center=True).mean(): window [i - floor(w/2), i - floor(w/2) + w)
    const smooth = new Array(n).fill(NaN);
    for (let i = 0; i < n; i++) {
      const s = i - Math.floor(w / 2), e = s + w;
      if (s < 0 || e > n) continue;
      let sum = 0, ok = true;
      for (let k = s; k < e; k++) { if (Number.isNaN(diff[k])) { ok = false; break; } sum += diff[k]; }
      if (ok) smooth[i] = sum / w;
    }
    const changes = [];
    let dir = null;
    for (let i = 1; i < n; i++) {
      const v = smooth[i];
      if (Number.isNaN(v)) continue;
      let nd;
      if (v > 0) nd = 'up'; else if (v < 0) nd = 'down'; else continue;
      if (dir !== null && nd !== dir) changes.push(i);
      dir = nd;
    }
    const bounds = [0, ...changes, n];
    const filtered = [bounds[0]];
    for (let i = 1; i < bounds.length; i++) if (bounds[i] - filtered[filtered.length - 1] >= minPoints) filtered.push(bounds[i]);
    const last = filtered[filtered.length - 1];
    if (n - last >= minPoints && last !== n) filtered.push(n);
    else if (n - last < minPoints && filtered.length > 1) filtered[filtered.length - 1] = n;
    if (filtered.length <= 2) return { segments: [], reason: '没有检测到多段 sweep' };

    const dot = name.lastIndexOf('.');
    const base = dot >= 0 ? name.slice(0, dot) : name;
    const ext = dot >= 0 ? name.slice(dot) : '';
    const segments = [];
    for (let i = 0; i < filtered.length - 1; i++) {
      const seg = sliceRows(df, filtered[i], filtered[i + 1]);
      const fs = seg.data[fieldCol].map(toNum);
      const direction = fs[fs.length - 1] > fs[0] ? 'up' : 'down';
      let paramStr = '';
      if (opts.paramCol && seg.columns.includes(opts.paramCol)) {
        const m = nanMean(seg.data[opts.paramCol]);
        if (!Number.isNaN(m)) {
          const label = opts.paramAbbrev || opts.paramCol;
          paramStr = (Math.abs(m) >= 1000 || (Math.abs(m) < 0.01 && m !== 0)) ? `${label}=${fmtE2(m)}_` : `${label}=${m.toFixed(3)}_`;
        }
      }
      segments.push({ name: `${paramStr}${base}_sweep${i + 1}_${direction}${ext}`, table: seg, direction,
        fieldStart: fs[0], fieldEnd: fs[fs.length - 1] });
    }
    return { segments };
  }

  // --------------------------------------------------------------- merge
  function unionColumns(tables) {
    const cols = [];
    for (const t of tables) for (const c of t.columns) if (!cols.includes(c)) cols.push(c);
    return cols;
  }

  function concatTables(a, b) {
    const cols = unionColumns([a, b]);
    const na = nrows(a), nb = nrows(b);
    const data = {};
    for (const c of cols) {
      const x = a.data[c] || new Array(na).fill(NaN), y = b.data[c] || new Array(nb).fill(NaN);
      data[c] = x.concat(y);
    }
    return { columns: cols, data };
  }

  function interleaveTables(a, b) {
    const cols = unionColumns([a, b]);
    const na = nrows(a), nb = nrows(b), m = Math.max(na, nb);
    const data = {};
    cols.forEach(c => { data[c] = []; });
    const push = (t, i) => cols.forEach(c => data[c].push(t.data[c] ? t.data[c][i] : NaN));
    for (let j = 0; j < m; j++) { if (j < na) push(a, j); if (j < nb) push(b, j); }
    return { columns: cols, data };
  }

  function combine(a, b, strategy) {
    return strategy === 'interleave' ? interleaveTables(a, b) : concatTables(a, b);
  }

  // filename stem used by merge_all_files / merge_sequential_pairs
  function mergeBase(filename) {
    let base = filename.includes('_sweep') ? filename.split('_sweep')[0] : filename;
    const parts = base.split('_');
    if (parts.length > 1 && parts[0].includes('=')) {
      const joined = parts.slice(1).join('_');
      base = joined || base;
    }
    if (!base || base === 'None') base = 'merged_file';
    return base;
  }

  // -> [{name, table, sources, parentOf}] ; getTable(name) returns current table
  function mergeAll(names, strategy, getTable) {
    let combined = null, base = 'merged_hysteresis';
    names.forEach((fn, i) => {
      const t = getTable(fn);
      if (!t) return;
      if (combined === null) {
        combined = cloneTable(t);
        if (fn.includes('_sweep')) base = mergeBase(fn);
      } else combined = combine(combined, t, strategy);
    });
    if (!combined) return [];
    if (!base || base === 'None') base = 'merged_file';
    return [{ name: `${base}_hysteresis_merged`, table: combined, sources: names, anchor: names[0] }];
  }

  function mergeSequential(names, strategy, getTable) {
    const out = [];
    for (let i = 0; i + 1 < names.length; i += 2) {
      const a = getTable(names[i]), b = getTable(names[i + 1]);
      if (!a || !b) continue;
      out.push({ name: `${mergeBase(names[i])}_hysteresis_pair${out.length + 1}`, table: combine(a, b, strategy),
        sources: [names[i], names[i + 1]], anchor: names[i] });
    }
    return out;
  }

  function mergeSmart(names, strategy, getTable) {
    const groups = new Map();
    for (const fn of names) {
      let key = 'no_param';
      if (fn.includes('=')) { const p = fn.split('_')[0]; if (p.includes('=')) key = p; }
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(fn);
    }
    const out = [];
    for (const files of groups.values()) {
      if (files.length < 2) continue;
      const ups = files.filter(f => f.includes('_up')), downs = files.filter(f => f.includes('_down'));
      for (let i = 0; i < Math.min(ups.length, downs.length); i++)
        out.push(...mergeSequential([ups[i], downs[i]], strategy, getTable));
    }
    return out.length ? out : mergeSequential(names, strategy, getTable);
  }

  // ---------------------------------------------------------------- export
  function csvCell(v) {
    if (isMissing(v)) return '';
    const s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // DataFrame.to_csv(index=False)
  function toCsv(t) {
    const lines = [t.columns.map(csvCell).join(',')];
    const n = nrows(t);
    for (let i = 0; i < n; i++) lines.push(t.columns.map(c => csvCell(t.data[c][i])).join(','));
    return lines.join('\n') + '\n';
  }

  // copy_to_clipboard: X/Y pairs side by side, tab separated
  function xyColumns(files, xCol, yCol, getTable) {
    const cols = [], headers = [];
    for (const fn of files) {
      const t = getTable(fn);
      if (!t || !t.columns.includes(xCol) || !t.columns.includes(yCol)) continue;
      cols.push(t.data[xCol], t.data[yCol]);
      headers.push(`${fn}_${xCol}`, `${fn}_${yCol}`);
    }
    return { cols, headers };
  }

  function xyTsv(files, xCol, yCol, getTable) {
    const { cols, headers } = xyColumns(files, xCol, yCol, getTable);
    if (!cols.length) return null;
    const m = Math.max(...cols.map(c => c.length));
    const lines = [headers.join('\t')];
    for (let i = 0; i < m; i++) lines.push(cols.map(c => (i < c.length && !isMissing(c[i]) ? String(c[i]) : '')).join('\t'));
    return { text: lines.join('\n'), pairs: cols.length / 2 };
  }

  // ---------------------------------------------------------- file manager
  // EnhancedFileManager: names are unique keys; folders hold ordered child names.
  class FileManager {
    constructor() { this.nodes = new Map(); this.rootItems = []; }

    _attach(name, parent) {
      if (parent && this.nodes.has(parent)) this.nodes.get(parent).children.push(name);
      else this.rootItems.push(name);
    }

    addFile(filename, table, parent = null) {
      const original = filename;
      let counter = 1;
      while (this.nodes.has(filename)) {
        const dot = original.lastIndexOf('.');
        filename = dot >= 0 ? `${original.slice(0, dot)}_${counter}${original.slice(dot)}` : `${original}_${counter}`;
        counter++;
      }
      const p = parent && this.nodes.has(parent) ? parent : null;
      const node = { name: filename, isFolder: false, parent: p, children: [], data: table, modified: null };
      this.nodes.set(filename, node);
      this._attach(filename, p);
      return node;
    }

    addFolder(folderName, parent = null) {
      const original = folderName;
      let counter = 1;
      const p = parent && this.nodes.has(parent) ? parent : null;
      while (this.nodes.has(folderName)) {
        const ex = this.nodes.get(folderName);
        if (ex.isFolder && ex.parent === p) return ex;
        folderName = `${original}_${counter}`;
        counter++;
      }
      const node = { name: folderName, isFolder: true, parent: p, children: [] };
      this.nodes.set(folderName, node);
      this._attach(folderName, p);
      return node;
    }

    siblings(name) {
      const n = this.nodes.get(name);
      return n && n.parent ? this.nodes.get(n.parent).children : this.rootItems;
    }

    filesRecursive(name) {
      const n = this.nodes.get(name);
      if (!n) return [];
      if (!n.isFolder) return [name];
      return n.children.flatMap(c => this.filesRecursive(c));
    }

    isInside(name, folder) {
      for (let n = this.nodes.get(name); n && n.parent; n = this.nodes.get(n.parent)) if (n.parent === folder) return true;
      return false;
    }

    moveItem(name, target, position = -1) {
      const n = this.nodes.get(name);
      if (!n || name === target || (target && this.isInside(target, name))) return false;
      const sib = this.siblings(name);
      sib.splice(sib.indexOf(name), 1);
      n.parent = target && this.nodes.has(target) ? target : null;
      const dest = n.parent ? this.nodes.get(n.parent).children : this.rootItems;
      if (position >= 0) dest.splice(position, 0, name); else dest.push(name);
      return true;
    }

    deleteItem(name) {
      const n = this.nodes.get(name);
      if (!n) return;
      if (n.isFolder) for (const c of n.children.slice()) this.deleteItem(c);
      const sib = this.siblings(name);
      const i = sib.indexOf(name);
      if (i >= 0) sib.splice(i, 1);
      this.nodes.delete(name);
    }

    rename(oldName, newName) {
      if (!newName || oldName === newName || this.nodes.has(newName)) return false;
      const n = this.nodes.get(oldName);
      if (!n) return false;
      const sib = this.siblings(oldName);
      sib[sib.indexOf(oldName)] = newName;
      if (n.isFolder) n.children.forEach(c => { this.nodes.get(c).parent = newName; });
      this.nodes.delete(oldName);
      n.name = newName;
      this.nodes.set(newName, n);
      return true;
    }

    current(name) {
      const n = this.nodes.get(name);
      return n && !n.isFolder ? (n.modified || n.data) : null;
    }

    update(name, table) {
      const n = this.nodes.get(name);
      if (n && !n.isFolder) n.modified = table;
    }

    reset(name) {
      const n = this.nodes.get(name);
      if (n && !n.isFolder && n.modified) { n.modified = null; return true; }
      return false;
    }

    // tree order walk: [{name, depth}]
    walk() {
      const out = [];
      const rec = (names, depth) => names.forEach(nm => { out.push({ name: nm, depth }); const n = this.nodes.get(nm); if (n.isFolder) rec(n.children, depth + 1); });
      rec(this.rootItems, 0);
      return out;
    }

    path(name) {
      const parts = [];
      for (let n = this.nodes.get(name); n; n = n.parent ? this.nodes.get(n.parent) : null) parts.unshift(n.name);
      return parts.join('/');
    }
  }

  // ------------------------------------------------------- project (JSON)
  const PROJECT_FORMAT = 'datapro-web-project';

  function encodeCol(a) { return a.map(v => (typeof v === 'number' && !Number.isFinite(v) ? (Number.isNaN(v) ? null : (v > 0 ? 'inf' : '-inf')) : v)); }
  function decodeCol(a) { return a.map(v => (v === null ? NaN : v === 'inf' ? Infinity : v === '-inf' ? -Infinity : v)); }
  function encodeTable(t) { return { columns: t.columns, data: t.columns.map(c => encodeCol(t.data[c])) }; }
  function decodeTable(o) { return makeTable(o.columns, o.data.map(decodeCol)); }

  // export_project equivalent: current data of every file, tree order preserved
  function projectToJson(fm) {
    const items = fm.walk().map(({ name }) => {
      const n = fm.nodes.get(name);
      const it = { name, is_folder: n.isFolder, parent_folder: n.parent || '' };
      if (!n.isFolder) it.table = encodeTable(fm.current(name));
      return it;
    });
    return JSON.stringify({ format: PROJECT_FORMAT, version: 1, items });
  }

  function projectFromJson(text) {
    const o = JSON.parse(text);
    if (!o || o.format !== PROJECT_FORMAT) throw new Error('不是 DataPro 网页版的工程文件');
    return o.items.map(it => ({ name: it.name, isFolder: !!it.is_folder, parent: it.parent_folder || null,
      table: it.is_folder ? undefined : decodeTable(it.table) }));
  }

  root.DP = {
    FileManager, projectToJson, projectFromJson,
    nrows, makeTable, cloneTable, takeRows, toNum, isMissing,
    parseTextFile, parseHkFile, detectDataStructure,
    parsePickledStrList, readHdfProject, hdfStoreKeys, readPandasGroup,
    makeLinear, makeCubic, npInterp, linspace,
    symmetrize, antisymmetrize, splitSweeps,
    mergeAll, mergeSequential, mergeSmart, mergeBase,
    toCsv, xyColumns, xyTsv,
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script id="src-mapping">
// DataPro web: 2D transport mapping.
// Ported from the "2D Transport Mapping" section of "datapro 20261012.py". scipy's griddata
// (Delaunay + LinearND / Clough-Tocher) is reimplemented here on top of Delaunator.
(function (root) {
  'use strict';
  const DP = root.DP;
  const finite = Number.isFinite;

  // ---------------------------------------------------------------- small numerics
  function linspace(a, b, n) {
    const out = new Float64Array(n);
    if (n === 1) { out[0] = a; return out; }
    const step = (b - a) / (n - 1);
    for (let i = 0; i < n; i++) out[i] = a + i * step;
    out[n - 1] = b;
    return out;
  }

  function nanMinMax(a) {
    let lo = Infinity, hi = -Infinity;
    for (const v of a) if (!Number.isNaN(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    return [lo, hi];
  }

  function median(values) {
    const a = Float64Array.from(values).sort();
    const n = a.length;
    if (!n) return NaN;
    return n % 2 ? a[(n - 1) >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }

  // numpy.nanpercentile with linear interpolation
  function nanPercentile(a, q) {
    const v = Float64Array.from(Array.prototype.filter.call(a, finite)).sort();
    if (!v.length) return NaN;
    const pos = (v.length - 1) * q / 100, lo = Math.floor(pos), hi = Math.ceil(pos);
    return v[lo] + (v[hi] - v[lo]) * (pos - lo);
  }

  function argsortStable(x, idx) {
    return idx.slice().sort((a, b) => (x[a] - x[b]) || (a - b));
  }

  // interp1d(kind='linear', bounds_error=False, fill_value=fill) on unsorted input
  function interpLinear(xIn, yIn, fillLo, fillHi) {
    const idx = argsortStable(xIn, Array.from(xIn, (_, i) => i));
    const x = idx.map(i => xIn[i]), y = idx.map(i => yIn[i]);
    const n = x.length;
    return v => {
      if (Number.isNaN(v)) return NaN;
      if (v < x[0]) return fillLo;
      if (v > x[n - 1]) return fillHi;
      return DP.npInterp(v, x, y);
    };
  }

  // ---------------------------------------------------------------- per-trace processing
  // mapping_symmetrize / mapping_anti_symmetrize
  function mirror(sweep, signal, sign) {
    const vx = [], vy = [];
    for (let i = 0; i < sweep.length; i++) if (!Number.isNaN(sweep[i]) && !Number.isNaN(signal[i])) { vx.push(sweep[i]); vy.push(signal[i]); }
    if (vx.length < 4) return Float64Array.from(signal);
    const f = interpLinear(vx, vy, NaN, NaN);
    return Float64Array.from(signal, (s, i) => (s + sign * f(-sweep[i])) / 2);
  }
  const mappingSymmetrize = (sweep, signal) => mirror(sweep, signal, 1);
  const mappingAntiSymmetrize = (sweep, signal) => mirror(sweep, signal, -1);

  // mapping_subtract_background: straight-line fit over the outer 20 % of the sweep range
  function mappingSubtractBackground(sweep, signal, log) {
    const valid = i => !Number.isNaN(sweep[i]) && !Number.isNaN(signal[i]);
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < sweep.length; i++) if (valid(i)) { lo = Math.min(lo, sweep[i]); hi = Math.max(hi, sweep[i]); }
    const threshold = 0.8 * (hi - lo) + lo;
    let n = 0, sx = 0, sy = 0;
    const fx = [], fy = [];
    for (let i = 0; i < sweep.length; i++) if (valid(i) && Math.abs(sweep[i]) >= threshold) { fx.push(sweep[i]); fy.push(signal[i]); }
    n = fx.length;
    if (n < 2) { log && log('背景拟合的点不足，已跳过扣背景'); return Float64Array.from(signal); }
    for (let i = 0; i < n; i++) { sx += fx[i]; sy += fy[i]; }
    const mx = sx / n, my = sy / n;
    let sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sxx += (fx[i] - mx) ** 2; sxy += (fx[i] - mx) * (fy[i] - my); }
    const k = sxy / sxx, b = my - k * mx;
    return Float64Array.from(signal, (s, i) => s - (k * sweep[i] + b));
  }

  // mapping_align_traces -> {sweep: Float64Array(n), aligned: [Float64Array(n) per trace]}
  function mappingAlignTraces(sweeps, signals, rangeMode, fillMode, log) {
    const mins = [], maxs = [], lens = [];
    for (const sw of sweeps) {
      const [lo, hi] = nanMinMax(sw);
      let k = 0;
      for (const v of sw) if (!Number.isNaN(v)) k++;
      if (!k) continue;
      mins.push(lo); maxs.push(hi); lens.push(k);
    }
    if (!mins.length) throw new Error('没有有效的扫描数据');
    let cmin, cmax, n;
    if (rangeMode === 'union') { cmin = Math.min(...mins); cmax = Math.max(...maxs); n = Math.max(...lens); }
    else { cmin = Math.max(...mins); cmax = Math.min(...maxs); n = Math.min(...lens); }
    if (cmin >= cmax) {
      log && log('各文件的扫描范围没有重叠，改用并集');
      cmin = Math.min(...mins); cmax = Math.max(...maxs); n = Math.max(...lens);
    }
    const sweep = linspace(cmin, cmax, n);
    const aligned = sweeps.map((sw, j) => {
      const sg = signals[j], vx = [], vy = [];
      for (let i = 0; i < sw.length; i++) if (!Number.isNaN(sw[i]) && !Number.isNaN(sg[i])) { vx.push(sw[i]); vy.push(sg[i]); }
      const out = new Float64Array(n).fill(NaN);
      if (vx.length < 4) return out;
      let f;
      if (rangeMode === 'union' && fillMode === 'boundary') {
        const ord = argsortStable(vx, vx.map((_, i) => i));
        f = interpLinear(vx, vy, vy[ord[0]], vy[ord[ord.length - 1]]);
      } else f = interpLinear(vx, vy, NaN, NaN);
      for (let i = 0; i < n; i++) out[i] = f(sweep[i]);
      return out;
    });
    return { sweep, aligned };
  }

  // ---------------------------------------------------------------- griddata
  // Triangulation plus the per-simplex neighbour table scipy's Delaunay exposes
  // (neighbour k is the triangle opposite vertex k).
  function triangulate(px, py) {
    const n = px.length;
    const coords = new Float64Array(2 * n);
    for (let i = 0; i < n; i++) { coords[2 * i] = px[i]; coords[2 * i + 1] = py[i]; }
    const d = new root.Delaunator(coords);
    const tri = d.triangles, he = d.halfedges, nt = tri.length / 3;
    // Points that only differ from a line by rounding still triangulate here, into slivers;
    // Qhull refuses them ("initial simplex is flat"), and so do we.
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, area = 0;
    for (let i = 0; i < n; i++) { x0 = Math.min(x0, px[i]); x1 = Math.max(x1, px[i]); y0 = Math.min(y0, py[i]); y1 = Math.max(y1, py[i]); }
    for (let t = 0; t < nt; t++) {
      const a = tri[3 * t], b = tri[3 * t + 1], c = tri[3 * t + 2];
      area += Math.abs((px[b] - px[a]) * (py[c] - py[a]) - (px[c] - px[a]) * (py[b] - py[a])) / 2;
    }
    if (!nt || !(area > 1e-9 * (x1 - x0) * (y1 - y0))) throw new Error('数据点几乎在一条直线上（或太少），无法做二维插值');
    const nb = new Int32Array(3 * nt);
    for (let t = 0; t < nt; t++) {
      // edge 3t+1 (v1->v2) is opposite v0, 3t+2 opposite v1, 3t opposite v2
      const opp = [3 * t + 1, 3 * t + 2, 3 * t];
      for (let k = 0; k < 3; k++) { const h = he[opp[k]]; nb[3 * t + k] = h < 0 ? -1 : Math.floor(h / 3); }
    }
    return { px, py, tri, nb, nt };
  }

  function barycentric(T, t, x, y, out) {
    const a = T.tri[3 * t], b = T.tri[3 * t + 1], c = T.tri[3 * t + 2];
    const xa = T.px[a], ya = T.py[a], xb = T.px[b], yb = T.py[b], xc = T.px[c], yc = T.py[c];
    const det = (yb - yc) * (xa - xc) + (xc - xb) * (ya - yc);
    out[0] = ((yb - yc) * (x - xc) + (xc - xb) * (y - yc)) / det;
    out[1] = ((yc - ya) * (x - xc) + (xa - xc) * (y - yc)) / det;
    out[2] = 1 - out[0] - out[1];
    return out;
  }

  // scipy.interpolate.interpnd.estimate_gradients_2d_global
  function estimateGradients(T, z, maxiter = 400, tol = 1e-6) {
    const n = T.px.length;
    const nbrs = Array.from({ length: n }, () => new Set());
    for (let t = 0; t < T.nt; t++) {
      const a = T.tri[3 * t], b = T.tri[3 * t + 1], c = T.tri[3 * t + 2];
      nbrs[a].add(b); nbrs[a].add(c); nbrs[b].add(a); nbrs[b].add(c); nbrs[c].add(a); nbrs[c].add(b);
    }
    const adj = nbrs.map(s => Int32Array.from([...s].sort((p, q) => p - q)));
    const gx = new Float64Array(n), gy = new Float64Array(n);
    for (let it = 0; it < maxiter; it++) {
      let err = 0;
      for (let i = 0; i < n; i++) {
        const nb = adj[i];
        if (!nb.length) continue;
        let q0 = 0, q1 = 0, q3 = 0, s0 = 0, s1 = 0;
        for (const j of nb) {
          const ex = T.px[j] - T.px[i], ey = T.py[j] - T.py[i];
          const L = Math.sqrt(ex * ex + ey * ey), L3 = L * L * L;
          const f1 = z[i], f2 = z[j];
          const df2 = -ex * gx[j] - ey * gy[j];
          q0 += 4 * ex * ex / L3; q1 += 4 * ex * ey / L3; q3 += 4 * ey * ey / L3;
          s0 += (6 * (f1 - f2) - 2 * df2) * ex / L3;
          s1 += (6 * (f1 - f2) - 2 * df2) * ey / L3;
        }
        const det = q0 * q3 - q1 * q1;
        const r0 = (q3 * s0 - q1 * s1) / det, r1 = (-q1 * s0 + q0 * s1) / det;
        let change = Math.max(Math.abs(gx[i] + r0), Math.abs(gy[i] + r1));
        gx[i] = -r0; gy[i] = -r1;
        change /= Math.max(1, Math.max(Math.abs(r0), Math.abs(r1)));
        if (change > err) err = change;
      }
      if (err < tol) break;
    }
    return { gx, gy };
  }

  // scipy's _clough_tocher_2d_single
  function cloughTocher(T, G, z, t, b) {
    const v0 = T.tri[3 * t], v1 = T.tri[3 * t + 1], v2 = T.tri[3 * t + 2];
    const e12x = T.px[v1] - T.px[v0], e12y = T.py[v1] - T.py[v0];
    const e23x = T.px[v2] - T.px[v1], e23y = T.py[v2] - T.py[v1];
    const e31x = T.px[v0] - T.px[v2], e31y = T.py[v0] - T.py[v2];
    const f1 = z[v0], f2 = z[v1], f3 = z[v2];
    const df12 = +(G.gx[v0] * e12x + G.gy[v0] * e12y);
    const df21 = -(G.gx[v1] * e12x + G.gy[v1] * e12y);
    const df23 = +(G.gx[v1] * e23x + G.gy[v1] * e23y);
    const df32 = -(G.gx[v2] * e23x + G.gy[v2] * e23y);
    const df31 = +(G.gx[v2] * e31x + G.gy[v2] * e31y);
    const df13 = -(G.gx[v0] * e31x + G.gy[v0] * e31y);
    const c3000 = f1, c2100 = (df12 + 3 * c3000) / 3, c2010 = (df13 + 3 * c3000) / 3;
    const c0300 = f2, c1200 = (df21 + 3 * c0300) / 3, c0210 = (df23 + 3 * c0300) / 3;
    const c0030 = f3, c1020 = (df31 + 3 * c0030) / 3, c0120 = (df32 + 3 * c0030) / 3;
    const c2001 = (c2100 + c2010 + c3000) / 3, c0201 = (c1200 + c0300 + c0210) / 3, c0021 = (c1020 + c0120 + c0030) / 3;
    // affine-invariant edge-normal directions from the neighbours' centroids
    const g = [0, 0, 0], c = [0, 0, 0];
    for (let k = 0; k < 3; k++) {
      const it = T.nb[3 * t + k];
      if (it === -1) { g[k] = -0.5; continue; }
      const a = T.tri[3 * it], bb = T.tri[3 * it + 1], cc = T.tri[3 * it + 2];
      barycentric(T, t, (T.px[a] + T.px[bb] + T.px[cc]) / 3, (T.py[a] + T.py[bb] + T.py[cc]) / 3, c);
      if (k === 0) g[k] = (2 * c[2] + c[1] - 1) / (2 - 3 * c[2] - 3 * c[1]);
      else if (k === 1) g[k] = (2 * c[0] + c[2] - 1) / (2 - 3 * c[0] - 3 * c[2]);
      else g[k] = (2 * c[1] + c[0] - 1) / (2 - 3 * c[1] - 3 * c[0]);
    }
    const c0111 = (g[0] * (-c0300 + 3 * c0210 - 3 * c0120 + c0030) + (-c0300 + 2 * c0210 - c0120 + c0021 + c0201)) / 2;
    const c1011 = (g[1] * (-c0030 + 3 * c1020 - 3 * c2010 + c3000) + (-c0030 + 2 * c1020 - c2010 + c2001 + c0021)) / 2;
    const c1101 = (g[2] * (-c3000 + 3 * c2100 - 3 * c1200 + c0300) + (-c3000 + 2 * c2100 - c1200 + c2001 + c0201)) / 2;
    const c1002 = (c1101 + c1011 + c2001) / 3, c0102 = (c1101 + c0111 + c0201) / 3, c0012 = (c1011 + c0111 + c0021) / 3;
    const c0003 = (c1002 + c0102 + c0012) / 3;
    const minval = Math.min(b[0], b[1], b[2]);
    const b1 = b[0] - minval, b2 = b[1] - minval, b3 = b[2] - minval, b4 = 3 * minval;
    return (b1 ** 3 * c3000 + 3 * b1 ** 2 * b2 * c2100 + 3 * b1 ** 2 * b3 * c2010 +
      3 * b1 ** 2 * b4 * c2001 + 3 * b1 * b2 ** 2 * c1200 +
      6 * b1 * b2 * b4 * c1101 + 3 * b1 * b3 ** 2 * c1020 + 6 * b1 * b3 * b4 * c1011 +
      3 * b1 * b4 ** 2 * c1002 + b2 ** 3 * c0300 + 3 * b2 ** 2 * b3 * c0210 +
      3 * b2 ** 2 * b4 * c0201 + 3 * b2 * b3 ** 2 * c0120 + 6 * b2 * b3 * b4 * c0111 +
      3 * b2 * b4 ** 2 * c0102 + b3 ** 3 * c0030 + 3 * b3 ** 2 * b4 * c0021 +
      3 * b3 * b4 ** 2 * c0012 + b4 ** 3 * c0003);

  // scipy.interpolate.griddata((px, py), z, meshgrid(xi, yi), method) -> Float64Array(ny*nx), row = y.
  // Grid points outside the convex hull stay NaN. method 'cubic' falls back to 'linear' like the desktop code.
  function griddata(px, py, z, xi, yi, method, log) {
    const T = triangulate(px, py);
    let G = null;
    if (method === 'cubic') {
      try { G = estimateGradients(T, z); } catch (e) { log && log('三次插值失败，改用线性'); }
    }
    const nx = xi.length, ny = yi.length;
    const out = new Float64Array(nx * ny).fill(NaN);
    const x0 = xi[0], dx = nx > 1 ? (xi[nx - 1] - xi[0]) / (nx - 1) : 1;
    const y0 = yi[0], dy = ny > 1 ? (yi[ny - 1] - yi[0]) / (ny - 1) : 1;
    const eps = 100 * 2.220446049250313e-16, b = [0, 0, 0];
    for (let t = 0; t < T.nt; t++) {
      const a = T.tri[3 * t], bb = T.tri[3 * t + 1], c = T.tri[3 * t + 2];
      const tx0 = Math.min(T.px[a], T.px[bb], T.px[c]), tx1 = Math.max(T.px[a], T.px[bb], T.px[c]);
      const ty0 = Math.min(T.py[a], T.py[bb], T.py[c]), ty1 = Math.max(T.py[a], T.py[bb], T.py[c]);
      const i0 = Math.max(0, Math.ceil((tx0 - x0) / dx - 1e-9)), i1 = Math.min(nx - 1, Math.floor((tx1 - x0) / dx + 1e-9));
      const j0 = Math.max(0, Math.ceil((ty0 - y0) / dy - 1e-9)), j1 = Math.min(ny - 1, Math.floor((ty1 - y0) / dy + 1e-9));
      for (let j = j0; j <= j1; j++) {
        const y = yi[j];
        for (let i = i0; i <= i1; i++) {
          const k = j * nx + i;
          if (!Number.isNaN(out[k])) continue;
          barycentric(T, t, xi[i], y, b);
          if (b[0] < -eps || b[1] < -eps || b[2] < -eps || b[0] > 1 + eps || b[1] > 1 + eps || b[2] > 1 + eps) continue;
          out[k] = G ? cloughTocher(T, G, z, t, b) : b[0] * z[a] + b[1] * z[bb] + b[2] * z[c];
        }
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- nearest-neighbour mask
  // Bucketed nearest-neighbour search standing in for scipy's cKDTree.
  function nnIndex(px, py) {
    const n = px.length;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < n; i++) { x0 = Math.min(x0, px[i]); x1 = Math.max(x1, px[i]); y0 = Math.min(y0, py[i]); y1 = Math.max(y1, py[i]); }
    const side = Math.max(1, Math.round(Math.sqrt(n / 2)));
    const cw = (x1 - x0) / side || 1, ch = (y1 - y0) / side || 1;
    const cell = (x, y) => [Math.min(side - 1, Math.max(0, Math.floor((x - x0) / cw))), Math.min(side - 1, Math.max(0, Math.floor((y - y0) / ch)))];
    const buckets = Array.from({ length: side * side }, () => []);
    for (let i = 0; i < n; i++) { const [cx, cy] = cell(px[i], py[i]); buckets[cy * side + cx].push(i); }
    // distance from (x, y) to its nearest point, skipping index `skip`
    return (x, y, skip = -1) => {
      const [cx, cy] = cell(x, y);
      let best = Infinity;
      for (let r = 0; r <= side; r++) {
        for (let gy = cy - r; gy <= cy + r; gy++) {
          if (gy < 0 || gy >= side) continue;
          for (let gx = cx - r; gx <= cx + r; gx++) {
            if (gx < 0 || gx >= side || (Math.abs(gx - cx) !== r && Math.abs(gy - cy) !== r)) continue;
            for (const k of buckets[gy * side + gx]) {
              if (k === skip) continue;
              const d = Math.hypot(px[k] - x, py[k] - y);
              if (d < best) best = d;
            }
          }
        }
        // anything not yet searched lies outside the (2r+1)^2 block of cells around the query
        const reach = Math.min(x - (x0 + (cx - r) * cw), x0 + (cx + r + 1) * cw - x,
          y - (y0 + (cy - r) * ch), y0 + (cy + r + 1) * ch - y);
        if (best <= reach) break;
      }
      return best;
    };
  }

  // mapping_grid_scattered
  function mappingGridScattered(xp, yp, zp, nGrid, log) {
    const xv = [], yv = [], zv = [];
    for (let i = 0; i < xp.length; i++) if (finite(xp[i]) && finite(yp[i]) && finite(zp[i])) { xv.push(xp[i]); yv.push(yp[i]); zv.push(zp[i]); }
    if (xv.length < 4) throw new Error('有效数据点不足，无法插值成网格');
    const [xa, xb] = nanMinMax(xv), [ya, yb] = nanMinMax(yv);
    const xi = linspace(xa, xb, nGrid), yi = linspace(ya, yb, nGrid);
    const Z = griddata(xv, yv, zv, xi, yi, 'cubic', log);
    // blank cells far from any measured point
    const sx = (xb - xa) > 0 ? xb - xa : 1, sy = (yb - ya) > 0 ? yb - ya : 1;
    const nxp = xv.map(v => v / sx), nyp = yv.map(v => v / sy);
    const near = nnIndex(nxp, nyp);
    const nn = nxp.map((v, i) => near(v, nyp[i], i));
    const threshold = 2 * median(nn);
    for (let j = 0; j < nGrid; j++) for (let i = 0; i < nGrid; i++) {
      if (near(xi[i] / sx, yi[j] / sy) > threshold) Z[j * nGrid + i] = NaN;
    }
    return { xi, yi, Z };
  }

  // mapping_make_2d_grid: aligned[j][i] is file j at sweep point i
  function mappingMake2dGrid(sweep, params, aligned, nGrid, log) {
    const xp = [], yp = [], zp = [];
    params.forEach((pv, j) => sweep.forEach((sv, i) => { const v = aligned[j][i]; if (!Number.isNaN(v)) { xp.push(sv); yp.push(pv); zp.push(v); } }));
    const [xa, xb] = nanMinMax(sweep), [ya, yb] = nanMinMax(params);
    const xi = linspace(xa, xb, nGrid), yi = linspace(ya, yb, nGrid);
    return { xi, yi, Z: griddata(xp, yp, zp, xi, yi, 'cubic', log) };
  }

  // mapping_calc_sweep_ratio
  function mappingCalcSweepRatio(xs, ys, log) {
    const ratios = [];
    xs.forEach((xa, k) => {
      const ya = ys[k], vx = [], vy = [];
      for (let i = 0; i < xa.length; i++) if (finite(xa[i]) && finite(ya[i])) { vx.push(xa[i]); vy.push(ya[i]); }
      if (vx.length < 2) return;
      const dx = vx[vx.length - 1] - vx[0];
      if (Math.abs(dx) < 1e-15) return;
      ratios.push((vy[vy.length - 1] - vy[0]) / dx);

    if (!ratios.length) { log && log('无法计算扫描比例，按 1.0 处理'); return 1; }

    log && log(`扫描比例 dY/dX = ${+r.toPrecision(6)}（来自 ${ratios.length} 条曲线）`);
    return r;
  }

  // mapping_transform_coords: rotate into n (along the sweep) and D (across it), then re-grid
  function mappingTransformCoords(G, ratio, nGrid, log) {

    const [xa, xb] = nanMinMax(xv), [ya, yb] = nanMinMax(yv);
    const xi = linspace(xa, xb, nGrid), yi = linspace(ya, yb, nGrid);
    return { xi, yi, Z: griddata(xv, yv, zv, xi, yi, 'cubic', log) };
  }

  function fillNaN(arr, mode) {

  // ---------------------------------------------------------------- the generate_map pipeline
  // files: [{name, cols: {colName: number[]}}]; s: settings as in the desktop dialog.

  function computeMapping(files, s, log = () => {}) {
    const num = c => Float64Array.from(c, DP.toNum);
    const col = (f, name) => { if (!(name in f.cols)) throw new Error(`${f.name} 里没有“${name}”列`); return num(f.cols[name]); };

      if (s.sym) sg = mappingSymmetrize(sw, sg);

      if (s.bg) sg = mappingSubtractBackground(sw, sg, log);
      return sg;
    };

      if (s.yColDual === s.xCol || s.yColDual === s.zCol) throw new Error('X、Y、Z 三列必须各不相同');

      const ax = cat(xs), ay = cat(ys);

      if (s.log) az = logAbs(az);

      if (s.transform) {
        const ratio = s.transformMode === 'auto' ? mappingCalcSweepRatio(xs, ys, log) : Number(s.transformRatio);
        if (!finite(ratio)) throw new Error('变换比例要填数字');
        G = mappingTransformCoords(G, ratio, nGrid, log);
        log(`已做坐标变换，比例 r = ${+ratio.toPrecision(6)}`);
      }
    } else {
      let params;
      if (s.ySource === 'manual') {
        const text = String(s.yManual || '').trim();
        if (!text) throw new Error('请填写每个文件对应的 Y 值，用逗号分隔');
        params = text.split(/[,，]/).map(v => Number(v.trim()));
        if (params.some(v => !finite(v))) throw new Error('Y 值里有不是数字的项');
        if (params.length !== files.length) throw new Error(`填了 ${params.length} 个 Y 值，但选了 ${files.length} 个文件，数量要一致`);
      } else {
        params = files.map(f => {
          const v = Array.from(col(f, s.yCol)).filter(a => !Number.isNaN(a));
          if (!v.length) return NaN;
          switch (s.yAgg) {
            case 'min': return Math.min(...v);
            case 'mean': return v.reduce((a, b) => a + b, 0) / v.length;
            case 'median': return median(v);
            case 'first': return v[0];

          }

      log(`Y 参数值：${params.map(v => +v.toPrecision(6)).join(', ')}`);
      const sweeps = files.map(f => col(f, s.xCol));
      const signals = files.map((f, i) => process(sweeps[i], col(f, s.zCol)));
      const rm = s.rangeMode;
      const A = rm === 'union_boundary' ? mappingAlignTraces(sweeps, signals, 'union', 'boundary', log)

      log(`对齐了 ${files.length} 条曲线，${A.sweep.length} 个点，范围 [${A.sweep[0].toFixed(4)}, ${A.sweep[A.sweep.length - 1].toFixed(4)}]`);
      let data = A.aligned;
      if (s.log) data = data.map(logAbs);

      if (s.nanFill !== 'nan') {
        const all = new Float64Array(data.reduce((n, a) => n + a.length, 0));
        let o = 0; for (const a of data) { all.set(a, o); o += a.length; }
        let lo = Infinity, hi = -Infinity;
        for (const v of all) if (!Number.isNaN(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }

      if (s.yInterp === 'discrete') {
        discrete = true;
        const nx = A.sweep.length;
        const Z = new Float64Array(nx * params.length);
        data.forEach((a, j) => Z.set(a, j * nx));
        G = { xi: A.sweep, yi: Float64Array.from(params), Z };
